<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高端车备料</title>
  <style>
    :root {
      --page-bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --radius-lg: 12px;
      --radius-pill: 999px;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--page-bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      flex: 1;
      width: 100%;
      max-width: 100%;
      min-height: 0;
      margin: 0 auto;
      padding: clamp(12px, 2vw, 24px);
      padding-bottom: clamp(16px, 3vw, 40px);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: clamp(16px, 2.2vw, 24px) clamp(14px, 2vw, 24px) clamp(14px, 2vw, 20px);
      box-sizing: border-box;
    }

    .shell-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .shell-head {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      margin-bottom: 22px;
    }

    .shell-head-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .shell-head h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .shell-tools {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }

    .combo-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 0 0 130px;
    }

    .combo-field span {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .combo-field input,
    .combo-field select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      min-width: 0;
    }

    .combo-field input:focus,
    .combo-field select:focus {
      border-color: #93c5fd;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .combo-actions {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex: 0 0 auto;
      margin-left: 0;
    }

    .shell-tools .btn-text {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }

    .shell-tools .btn-text:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .shell-tools .btn-text.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .shell-tools .btn-text.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .stats-row {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, 2vw, 14px);
      margin-bottom: 22px;
    }

    @media (max-width: 720px) {
      .stats-row {
        grid-template-columns: 1fr;
      }
    }

    .stat-card {
      border-radius: var(--radius-lg);
      padding: 16px 16px 14px;
      position: relative;
      min-height: 0;
    }

    .stat-card .stat-title {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }

    .stat-card .stat-num {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #111827;
      line-height: 1.15;
      margin-bottom: 0;
    }

    .stat-card.c-orange {
      background: #fff;
      border: 1px solid #d7d7d7;
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }

    .stat-card.js-stat-filter {
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.12s;
    }

    .stat-card.js-stat-filter:hover {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .stat-card.js-stat-filter.is-active {
      box-shadow: 0 0 0 2px var(--primary), var(--shadow);
    }

    .table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      margin: 0 -4px;
      -webkit-overflow-scrolling: touch;
    }

    table.task-table {
      width: 100%;
      min-width: 1240px;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.task-table .col-material {
      word-break: break-word;
    }

    table.task-table th,
    table.task-table td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    table.task-table th {
      background: #fafafa;
      font-weight: 600;
      color: #6b7280;
      white-space: nowrap;
      font-size: 12px;
    }

    table.task-table tbody tr:hover {
      background: #f9fafb;
    }

    table.task-table td {
      color: #374151;
    }

    tr.order-row {
      background: #fff;
    }

    tr.order-row > td {
      vertical-align: top;
    }

    .order-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .expand-btn {
      width: 22px;
      height: 22px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
      color: #6b7280;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .expand-btn:hover {
      border-color: #93c5fd;
      color: #2563eb;
    }

    .child-wrap-cell {
      padding: 0 !important;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .sub-table-wrap {
      padding: 10px 16px 14px;
    }

    table.sub-task-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }

    table.sub-task-table th,
    table.sub-task-table td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: middle;
    }

    table.sub-task-table th {
      background: #f9fafb;
      color: #6b7280;
      font-weight: 600;
      white-space: nowrap;
    }

    table.sub-task-table tbody tr:last-child td {
      border-bottom: none;
    }

    .material-cell .name {
      font-weight: 500;
      color: #111827;
    }

    .badge-prio {
      display: inline-block;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
    }

    .badge-prio.urgent {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-prio.normal {
      background: #ffedd5;
      color: #c2410c;
    }

    .badge-status {
      display: inline-block;
      padding: 3px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
    }

    .badge-status.pending {
      background: #ffedd5;
      color: #c2410c;
    }

    .badge-status.delivery {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-status.done {
      background: #d1fae5;
      color: #047857;
    }

    .badge-status.progress {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .progress-cell {
      font-variant-numeric: tabular-nums;
      color: #374151;
    }

    .actions .link-btn {
      display: inline-block;
      margin-right: 10px;
      padding: 0;
      border: none;
      background: none;
      color: var(--primary);
      font-weight: 500;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .actions .link-btn:hover:not(:disabled) {
      text-decoration: underline;
      color: var(--primary-hover);
    }

    .actions .link-btn:disabled {
      color: #c4c9d4;
      cursor: not-allowed;
      text-decoration: none;
    }

    .actions a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      margin-right: 12px;
    }

    .actions a:hover {
      text-decoration: underline;
      color: var(--primary-hover);
    }

    .pagination-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 16px;
      margin-top: 4px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .pagination-bar-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-size-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .page-size-control select {
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    #totalCountLabel {
      color: var(--text);
      font-weight: 500;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pagination button {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: #374151;
    }

    .pagination button:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pagination button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagination button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .empty-row td {
      text-align: center;
      color: #9ca3af;
      padding: 32px !important;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <header class="shell-head">
        <div class="shell-head-title-row">
          <h1>高端车备料任务</h1>
        </div>
        <div class="shell-tools" role="search" aria-label="组合筛选">
          <label class="combo-field">
            <span>销售订单号</span>
            <input type="search" id="filterSalesOrderNo" placeholder="SO..." autocomplete="off" />
          </label>
          <label class="combo-field">
            <span>生产订单号</span>
            <input type="search" id="filterProductionOrderNo" placeholder="MO..." autocomplete="off" />
          </label>
          <label class="combo-field">
            <span>图号</span>
            <input type="search" id="filterDrawingNo" placeholder="TH-..." autocomplete="off" />
          </label>
          <label class="combo-field">
            <span>整车码</span>
            <input type="search" id="filterWholeCode" placeholder="SP202604..." autocomplete="off" />
          </label>
          <label class="combo-field">
            <span>订单备料状态</span>
            <select id="filterOrderPrepStatus" title="订单备料状态">
              <option value="">全部</option>
              <option value="待备料">待备料</option>
              <option value="进行中">进行中</option>
              <option value="备料完成">备料完成</option>
            </select>
          </label>
          <label class="combo-field">
            <span>整车备料状态</span>
            <select id="filterItemPrepStatus" title="整车备料状态">
              <option value="">全部</option>
              <option value="待备料">待备料</option>
              <option value="进行中">进行中</option>
              <option value="备料完成">备料完成</option>
            </select>
          </label>
          <label class="combo-field">
            <span>生产状态</span>
            <select id="filterProdStatus" title="生产状态">
              <option value="">全部</option>
              <option value="生效">生效</option>
              <option value="生产中">生产中</option>
              <option value="已完成">已完成</option>
            </select>
          </label>
          <div class="combo-actions">
            <button type="button" class="btn-text primary" id="btnFilter" title="按条件组合筛选">筛选</button>
            <button type="button" class="btn-text" id="btnResetSearch" title="清空条件并显示全部">重置</button>
          </div>
        </div>
      </header>

      <section class="stats-row" aria-label="统计概览">
        <div
          class="stat-card c-orange js-stat-filter"
          data-filter="unfinished"
          tabindex="0"
          role="button"
          aria-pressed="false"
          title="点击筛选未完成备料订单"
        >
          <span class="stat-title">待完成</span>
          <span class="stat-num" id="statUnfinished">0</span>
        </div>
        <div
          class="stat-card c-orange js-stat-filter"
          data-filter="currentPrep"
          tabindex="0"
          role="button"
          aria-pressed="false"
          title="点击筛选计划备料时间为当天的订单"
        >
          <span class="stat-title">当前订单</span>
          <span class="stat-num" id="statCurrentPrep">0</span>
        </div>
        <div
          class="stat-card c-orange js-stat-filter"
          data-filter="futurePrep"
          tabindex="0"
          role="button"
          aria-pressed="false"
          title="点击筛选计划备料时间晚于今天的订单"
        >
          <span class="stat-title">计划订单</span>
          <span class="stat-num" id="statFuturePrep">0</span>
        </div>
      </section>

      <div class="shell-main">
        <div class="table-wrap">
          <table class="task-table">
            <thead>
              <tr>
                <th>销售订单号</th>
                <th>生产订单号</th>
                <th>图号</th>
                <th>数量</th>
                <th style="min-width:110px">计划备料时间</th>
                <th>优先级</th>
                <th>订单备料状态</th>
                <th style="min-width:100px">产线</th>
                <th style="min-width:88px">生产状态</th>
              </tr>
            </thead>
            <tbody id="taskBody"></tbody>
          </table>
        </div>

        <footer class="pagination-bar">
          <div class="pagination-bar-meta">
            <span id="totalCountLabel">共 0 条数据</span>
            <span class="page-size-control">
              <span>每页展示</span>
              <select id="pageSizeSelect" title="每页条数" aria-label="每页展示条数">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
              <span>条</span>
            </span>
            <span id="pageInfo">显示 0–0 条</span>
          </div>
          <div class="pagination" id="pagination"></div>
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = "luxury_car_prep_orders_v1";

      function loadStore() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }

      function saveStore(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function localDateStr(d) {
        return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      }

      function localTodayStr() {
        return localDateStr(new Date());
      }

      function matProgress(o) {
        var mats = o.materials || [];
        var n = mats.length;
        if (!n) return { text: "0/0", done: 0, total: 0 };
        var done = mats.filter(function (m) {
          return m.pickStatus === "领料完成";
        }).length;
        return { text: done + "/" + n, done: done, total: n };
      }

      function refreshPrepStatusFromMaterials(o) {
        var mats = o.materials || [];
        if (!mats.length) return;
        var allDone = mats.every(function (m) {
          return m.pickStatus === "领料完成" || m.prepStatus === "备料完成";
        });
        if (allDone) {
          o.prepStatus = "备料完成";
          return;
        }
        if (!allDone && (o.prepStatus === "已完成" || o.prepStatus === "备料完成")) {
          o.prepStatus = "进行中";
        }
      }

      function padWhId(n) {
        var s = String(n);
        while (s.length < 3) s = "0" + s;
        return s;
      }

      /** 历史或外部数据可能缺少单品码：按订单 id 序号补齐，与默认演示规则一致 */
      function ensureOrderSingleCode(o) {
        if (!o || o.singleCode) return;
        var idx = 0;
        var mid = String(o.id || "").match(/(\d+)/);
        if (mid) idx = Math.max(0, parseInt(mid[1], 10) - 1);
        o.singleCode = "SP202604" + padWhId(100 + idx);
      }

      function ensureOrderPlanDate(o) {
        if (!o) return;
        if (o.planPrepDate) return;
        var idx = 0;
        var mid = String(o.id || "").match(/(\d+)/);
        if (mid) idx = Math.max(0, parseInt(mid[1], 10) - 1);
        var d = new Date();
        d.setDate(d.getDate() + ((idx % 7) - 2));
        o.planPrepDate = localDateStr(d);
      }

      function ensureOrderMetaFields(o) {
        if (!o) return;
        var idx = 0;
        var mid = String(o.id || "").match(/(\d+)/);
        if (mid) idx = Math.max(0, parseInt(mid[1], 10) - 1);
        if (!o.salesOrderNo) o.salesOrderNo = "SO202604" + padWhId(100 + idx);
        if (!o.productionOrderNo) o.productionOrderNo = "MO202604" + padWhId(100 + idx);
        if (!o.drawingNo) o.drawingNo = "TH-" + String(100 + idx);
        if (!o.line) o.line = "普车组装1线";
        if (!o.prodStatus) o.prodStatus = ["生效", "生产中", "已完成"][idx % 3];
      }

      function normalizedQty(v) {
        var n = parseInt(v, 10);
        if (!n || n < 1) return 1;
        return n;
      }

      function ensureOrderProducts(o) {
        if (!o) return;
        var qty = normalizedQty(o.qty);
        o.qty = qty;
        if (!Array.isArray(o.products)) o.products = [];
        var next = [];
        var i;
        for (i = 0; i < qty; i++) {
          var existing = o.products[i] || {};
          var pid = existing.id || ("item-" + padWhId(i + 1));
          var wholeCode = existing.wholeCode || (String(o.singleCode || "SP") + "-" + padWhId(i + 1));
          next.push({
            id: pid,
            wholeCode: wholeCode,
            productName: existing.productName || o.productName || "未命名产品",
            prepStatus:
              (existing.prepStatus === "已完成" ? "备料完成" : existing.prepStatus) ||
              (o.prepStatus === "已完成" ? "备料完成" : o.prepStatus) ||
              "待备料",
          });
        }
        o.products = next;
      }

      function syncOrderPrepStatusFromProducts(o) {
        if (!o || !Array.isArray(o.products) || !o.products.length) return;
        var allDone = o.products.every(function (p) {
          return p.prepStatus === "备料完成";
        });
        if (allDone) {
          o.prepStatus = "备料完成";
          return;
        }
        var hasStarted = o.products.some(function (p) {
          return p.prepStatus !== "待备料";
        });
        o.prepStatus = hasStarted ? "进行中" : "待备料";
      }

      /** 与「生产作业」36 条任务一致：单品码、零件名、计划数量 */
      function buildAlignedWarehouseOrders36() {
        var out = [];
        var pickRot = ["待领料", "部分领料", "领料完成"];
        var i;
        for (i = 0; i < 36; i++) {
          var num = i + 1;
          var wid = "wo-" + padWhId(num);
          var planQty = 30 + (i % 6) * 10;
          var mats = [];
          var j;
          for (j = 0; j < 3; j++) {
            var ps = pickRot[(i + j) % 3];
            var req = 5 + j * 4 + (i % 8);
            var cq = null;
            var ci = "";
            if (ps === "领料完成") {
              cq = req;
            } else if (ps === "部分领料") {
              cq = Math.max(1, Math.floor(req / 2));
              ci = String(cq);
            }
            mats.push({
              code: "M-" + padWhId(num) + "-" + (j + 1),
              name: "物料-" + (j + 1),
              spec: "SPEC-" + num + "-" + (j + 1),
              unit: ["PCS", "SET", "M"][j % 3],
              pickStatus: ps,
              stockQty: 100 + ((i * 17 + j * 11) % 500),
              reqQty: req,
              currentPickQty: cq,
              currentPickInput: ci,
            });
          }
          out.push({
            id: wid,
            salesOrderNo: "SO202604" + padWhId(100 + i),
            productionOrderNo: "MO202604" + padWhId(100 + i),
            drawingNo: "TH-" + String(100 + i),
            singleCode: "SP202604" + padWhId(100 + i),
            productName: "零件-" + ((i % 9) + 1),
            qty: planQty,
            prio: "一般",
            prepStatus: ["待备料", "进行中", "备料完成"][i % 3],
            planPrepDate: localDateStr(new Date(Date.now() + (((i % 7) - 2) * 86400000))),
            line: "普车组装1线",
            prodStatus: ["生效", "生产中", "已完成"][i % 3],
            materials: mats,
          });
        }
        return out;
      }

      var DEFAULT_ORDERS = buildAlignedWarehouseOrders36();

      function ensureOrders() {
        var st = loadStore();
        if (st && st.orders && st.orders.length) {
          st.orders.forEach(function (o) {
            ensureOrderSingleCode(o);
            ensureOrderPlanDate(o);
            ensureOrderMetaFields(o);
            refreshPrepStatusFromMaterials(o);
            ensureOrderProducts(o);
            syncOrderPrepStatusFromProducts(o);
          });
          saveStore(st);
          return st.orders;
        }
        var fresh = JSON.parse(JSON.stringify(DEFAULT_ORDERS));
        fresh.forEach(function (o) {
          ensureOrderSingleCode(o);
          ensureOrderPlanDate(o);
          ensureOrderMetaFields(o);
          refreshPrepStatusFromMaterials(o);
          ensureOrderProducts(o);
          syncOrderPrepStatusFromProducts(o);
        });
        saveStore({ orders: fresh });
        return fresh;
      }

      var allOrders = ensureOrders();

      function countByPrep(status) {
        return allOrders.filter(function (o) {
          return o.prepStatus === status;
        }).length;
      }

      function countUnfinished() {
        return allOrders.filter(function (o) {
          return o.prepStatus !== "备料完成" && o.prepStatus !== "已完成";
        }).length;
      }

      function countCurrentPrep() {
        var today = localTodayStr();
        return allOrders.filter(function (o) {
          return String(o.planPrepDate || "") === today;
        }).length;
      }

      function countFuturePrep() {
        var today = localTodayStr();
        return allOrders.filter(function (o) {
          var d = String(o.planPrepDate || "");
          return d && d > today;
        }).length;
      }

      function refreshStatCards() {
        var su = document.getElementById("statUnfinished");
        var sc = document.getElementById("statCurrentPrep");
        var sf = document.getElementById("statFuturePrep");
        if (su) su.textContent = String(countUnfinished());
        if (sc) sc.textContent = String(countCurrentPrep());
        if (sf) sf.textContent = String(countFuturePrep());
      }

      function prioClass(p) {
        return p === "紧急" ? "urgent" : "normal";
      }

      function prepStatusClass(s) {
        if (s === "待备料") return "pending";
        if (s === "进行中") return "progress";
        if (s === "已完成" || s === "备料完成") return "done";
        return "pending";
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function pickUrl(id, mode, itemId, wholeCode) {
        var url =
          "高端车订单备料.html?id=" +
          encodeURIComponent(id) +
          "&mode=" +
          encodeURIComponent(mode);
        if (itemId) url += "&itemId=" + encodeURIComponent(itemId);
        if (wholeCode) url += "&wholeCode=" + encodeURIComponent(wholeCode);
        return url;
      }

      var state = {
        filtered: allOrders.slice(),
        page: 1,
        statFilter: null,
        filterSalesOrderNoApplied: "",
        filterProductionOrderNoApplied: "",
        filterDrawingNoApplied: "",
        filterWholeCodeApplied: "",
        filterOrderPrepStatusApplied: "",
        filterItemPrepStatusApplied: "",
        filterProdStatusApplied: "",
        expandedOrderIds: {},
        pageSize: 20,
      };

      function applyStatAndSearch(resetPage) {
        var base = allOrders.map(function (o) {
          var copy = Object.assign({}, o);
          copy._filteredProducts = Array.isArray(o.products) ? o.products.slice() : [];
          return copy;
        });
        if (state.statFilter === "unfinished") {
          base = base.filter(function (o) {
            return o.prepStatus !== "备料完成" && o.prepStatus !== "已完成";
          });
        } else if (state.statFilter === "currentPrep") {
          base = base.filter(function (o) {
            return String(o.planPrepDate || "") === localTodayStr();
          });
        } else if (state.statFilter === "futurePrep") {
          base = base.filter(function (o) {
            var d = String(o.planPrepDate || "");
            return d && d > localTodayStr();
          });
        }

        var salesOrderNoQuery = String(state.filterSalesOrderNoApplied || "").trim().toLowerCase();
        var productionOrderNoQuery = String(state.filterProductionOrderNoApplied || "").trim().toLowerCase();
        var drawingNoQuery = String(state.filterDrawingNoApplied || "").trim().toLowerCase();
        var wholeCodeQuery = String(state.filterWholeCodeApplied || "").trim().toLowerCase();
        var orderPrepStatusQuery = String(state.filterOrderPrepStatusApplied || "").trim();
        var itemPrepStatusQuery = String(state.filterItemPrepStatusApplied || "").trim();
        var prodStatusQuery = String(state.filterProdStatusApplied || "").trim();

        if (
          salesOrderNoQuery ||
          productionOrderNoQuery ||
          drawingNoQuery ||
          orderPrepStatusQuery ||
          prodStatusQuery
        ) {
          base = base.filter(function (t) {
            var hitSalesOrderNo =
              !salesOrderNoQuery ||
              String(t.salesOrderNo || "")
                .toLowerCase()
                .indexOf(salesOrderNoQuery) !== -1;
            var hitProductionOrderNo =
              !productionOrderNoQuery ||
              String(t.productionOrderNo || "")
                .toLowerCase()
                .indexOf(productionOrderNoQuery) !== -1;
            var hitDrawingNo =
              !drawingNoQuery ||
              String(t.drawingNo || "")
                .toLowerCase()
                .indexOf(drawingNoQuery) !== -1;
            var hitOrderPrepStatus =
              !orderPrepStatusQuery || String(t.prepStatus || "") === orderPrepStatusQuery;
            var hitProdStatus =
              !prodStatusQuery || String(t.prodStatus || "") === prodStatusQuery;
            return hitSalesOrderNo && hitProductionOrderNo && hitDrawingNo && hitOrderPrepStatus && hitProdStatus;
          });
        }

        var childFilterOn = !!(wholeCodeQuery || itemPrepStatusQuery);
        if (childFilterOn) {
          base = base
            .map(function (t) {
              var childRows = Array.isArray(t._filteredProducts) ? t._filteredProducts : [];
              childRows = childRows.filter(function (p) {
                var hitWholeCode =
                  !wholeCodeQuery ||
                  String(p.wholeCode || "")
                    .toLowerCase()
                    .indexOf(wholeCodeQuery) !== -1;
                var hitItemPrepStatus =
                  !itemPrepStatusQuery || String(p.prepStatus || "") === itemPrepStatusQuery;
                return hitWholeCode && hitItemPrepStatus;
              });
              t._filteredProducts = childRows;
              return t;
            })
            .filter(function (t) {
              return t._filteredProducts.length > 0;
            });
        }
        if (childFilterOn) {
          var nextExpanded = {};
          base.forEach(function (t) {
            nextExpanded[t.id] = true;
          });
          state.expandedOrderIds = nextExpanded;
        }
        state.filtered = base;
        if (resetPage !== false) state.page = 1;
        render();
      }

      function applySearchFilterClick() {
        state.filterSalesOrderNoApplied = document.getElementById("filterSalesOrderNo").value;
        state.filterProductionOrderNoApplied = document.getElementById("filterProductionOrderNo").value;
        state.filterDrawingNoApplied = document.getElementById("filterDrawingNo").value;
        state.filterWholeCodeApplied = document.getElementById("filterWholeCode").value;
        state.filterOrderPrepStatusApplied = document.getElementById("filterOrderPrepStatus").value;
        state.filterItemPrepStatusApplied = document.getElementById("filterItemPrepStatus").value;
        state.filterProdStatusApplied = document.getElementById("filterProdStatus").value;
        applyStatAndSearch(true);
      }

      function resetSearchAndTable() {
        document.getElementById("filterSalesOrderNo").value = "";
        document.getElementById("filterProductionOrderNo").value = "";
        document.getElementById("filterDrawingNo").value = "";
        document.getElementById("filterWholeCode").value = "";
        document.getElementById("filterOrderPrepStatus").value = "";
        document.getElementById("filterItemPrepStatus").value = "";
        document.getElementById("filterProdStatus").value = "";
        state.filterSalesOrderNoApplied = "";
        state.filterProductionOrderNoApplied = "";
        state.filterDrawingNoApplied = "";
        state.filterWholeCodeApplied = "";
        state.filterOrderPrepStatusApplied = "";
        state.filterItemPrepStatusApplied = "";
        state.filterProdStatusApplied = "";
        state.statFilter = null;
        state.page = 1;
        document.querySelectorAll(".js-stat-filter").forEach(function (el) {
          el.classList.remove("is-active");
          el.setAttribute("aria-pressed", "false");
        });
        applyStatAndSearch(true);
      }

      function setStatFilter(filterId) {
        if (state.statFilter === filterId) {
          state.statFilter = null;
        } else {
          state.statFilter = filterId;
        }
        document.querySelectorAll(".js-stat-filter").forEach(function (el) {
          var id = el.getAttribute("data-filter");
          var on = state.statFilter && id === state.statFilter;
          el.classList.toggle("is-active", !!on);
          el.setAttribute("aria-pressed", on ? "true" : "false");
        });
        applyStatAndSearch();
      }

      function initStatCardFilters() {
        document.querySelectorAll(".js-stat-filter").forEach(function (card) {
          card.addEventListener("click", function () {
            setStatFilter(card.getAttribute("data-filter"));
          });
          card.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              setStatFilter(card.getAttribute("data-filter"));
            }
          });
        });
      }

      function pageSizeNow() {
        var n = Number(state.pageSize);
        if (!n || n < 1) return 20;
        return n;
      }

      function slicePage() {
        var ps = pageSizeNow();
        var start = (state.page - 1) * ps;
        return state.filtered.slice(start, start + ps);
      }

      function renderTable() {
        var tbody = document.getElementById("taskBody");
        var rows = slicePage();
        tbody.innerHTML = "";

        if (!rows.length) {
          var tr = document.createElement("tr");
          tr.className = "empty-row";
          tr.innerHTML = '<td colspan="9">未找到匹配的订单</td>';
          tbody.appendChild(tr);
          return;
        }

        function subActionsHtml(orderId, item) {
          var mode = item.prepStatus === "待备料" ? "edit" : "edit";
          var text = item.prepStatus === "待备料" ? "开始" : "编辑";
          return (
            '<button type="button" class="link-btn js-item-edit" data-id="' +
            escapeHtml(orderId) +
            '" data-item-id="' +
            escapeHtml(item.id) +
            '" data-whole-code="' +
            escapeHtml(item.wholeCode || "") +
            '" data-mode="' +
            escapeHtml(mode) +
            '">' +
            text +
            "</button>"
          );
        }

        rows.forEach(function (t) {
          ensureOrderProducts(t);
          syncOrderPrepStatusFromProducts(t);
          var expanded = !!state.expandedOrderIds[t.id];
          var trMain = document.createElement("tr");
          trMain.className = "order-row";
          trMain.innerHTML =
            '<td><span class="order-cell"><button type="button" class="expand-btn js-toggle-order" data-id="' +
            escapeHtml(t.id) +
            '" aria-label="展开/收起子表" title="展开/收起子表">' +
            (expanded ? "▾" : "▸") +
            "</button>" +
            "<span>" +
            escapeHtml(t.salesOrderNo || "") +
            "</span></span></td>" +
            "<td>" +
            escapeHtml(t.productionOrderNo || "") +
            "</td>" +
            "<td>" +
            escapeHtml(t.drawingNo || "") +
            "</td>" +
            "<td>" +
            escapeHtml(String(t.qty !== undefined && t.qty !== null ? t.qty : "")) +
            "</td>" +
            "<td>" +
            escapeHtml(t.planPrepDate || "") +
            "</td>" +
            '<td><span class="badge-prio ' +
            prioClass(t.prio) +
            '">' +
            escapeHtml(t.prio || "") +
            "</span></td>" +
            '<td><span class="badge-status ' +
            prepStatusClass(t.prepStatus) +
            '">' +
            escapeHtml(t.prepStatus || "") +
            "</span></td>" +
            "<td>" +
            escapeHtml(t.line || "") +
            "</td>" +
            "<td>" +
            escapeHtml(t.prodStatus || "") +
            "</td>";
          tbody.appendChild(trMain);

          if (expanded) {
            var productsToShow =
              Array.isArray(t._filteredProducts) && t._filteredProducts.length
                ? t._filteredProducts
                : (Array.isArray(t.products) ? t.products : []);
            var trChild = document.createElement("tr");
            trChild.className = "child-row";
            trChild.innerHTML =
              '<td colspan="9" class="child-wrap-cell">' +
              '<div class="sub-table-wrap">' +
              '<table class="sub-task-table" aria-label="订单下整车明细">' +
              "<thead><tr>" +
              "<th>整车码</th>" +
              '<th class="col-material">产品名称</th>' +
              "<th>整车备料状态</th>" +
              '<th style="min-width:140px">操作</th>' +
              "</tr></thead>" +
              "<tbody>" +
              productsToShow
                .map(function (p) {
                  return (
                    "<tr>" +
                    "<td>" +
                    escapeHtml(p.wholeCode || "") +
                    "</td>" +
                    '<td class="material-cell col-material"><span class="name">' +
                    escapeHtml(p.productName || "") +
                    "</span></td>" +
                    '<td><span class="badge-status ' +
                    prepStatusClass(p.prepStatus || "待备料") +
                    '">' +
                    escapeHtml(p.prepStatus || "待备料") +
                    "</span></td>" +
                    '<td class="actions">' +
                    subActionsHtml(t.id, p) +
                    "</td>" +
                    "</tr>"
                  );
                })
                .join("") +
              "</tbody>" +
              "</table>" +
              "</div>" +
              "</td>";
            tbody.appendChild(trChild);
          }
        });

        tbody.querySelectorAll(".js-toggle-order").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var id = btn.getAttribute("data-id");
            state.expandedOrderIds[id] = !state.expandedOrderIds[id];
            renderTable();
          });
        });

        tbody.querySelectorAll(".js-item-edit").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var id = btn.getAttribute("data-id");
            var itemId = btn.getAttribute("data-item-id");
            var wholeCode = btn.getAttribute("data-whole-code");
            var mode = btn.getAttribute("data-mode") || "edit";
            location.href = pickUrl(id, mode, itemId, wholeCode);
          });
        });
      }

      function renderPagination() {
        var total = state.filtered.length;
        var ps = pageSizeNow();
        var pages = Math.max(1, Math.ceil(total / ps));
        if (state.page > pages) state.page = pages;
        if (state.page < 1) state.page = 1;

        var start = total === 0 ? 0 : (state.page - 1) * ps + 1;
        var end = Math.min(state.page * ps, total);

        var tc = document.getElementById("totalCountLabel");
        if (tc) tc.textContent = "共 " + total + " 条数据";

        var pi = document.getElementById("pageInfo");
        if (pi) {
          pi.textContent =
            total === 0 ? "显示 0–0 条" : "显示 " + start + "–" + end + " 条";
        }

        var sel = document.getElementById("pageSizeSelect");
        if (sel && String(sel.value) !== String(state.pageSize)) {
          sel.value = String(state.pageSize);
        }

        var pag = document.getElementById("pagination");
        pag.innerHTML = "";

        var prev = document.createElement("button");
        prev.type = "button";
        prev.textContent = "‹";
        prev.disabled = pages <= 1 || state.page <= 1;
        prev.addEventListener("click", function () {
          if (state.page > 1) {
            state.page--;
            render();
          }
        });
        pag.appendChild(prev);

        for (var i = 1; i <= pages; i++) {
          (function (p) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = String(p);
            if (p === state.page) b.classList.add("active");
            b.addEventListener("click", function () {
              state.page = p;
              render();
            });
            pag.appendChild(b);
          })(i);
        }

        var next = document.createElement("button");
        next.type = "button";
        next.textContent = "›";
        next.disabled = state.page >= pages;
        next.addEventListener("click", function () {
          if (state.page < pages) {
            state.page++;
            render();
          }
        });
        pag.appendChild(next);
      }

      function render() {
        refreshStatCards();
        renderTable();
        renderPagination();
      }

      ["filterSalesOrderNo", "filterProductionOrderNo", "filterDrawingNo", "filterWholeCode"].forEach(function (id) {
        document.getElementById(id).addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            applySearchFilterClick();
          }
        });
      });

      document.getElementById("btnFilter").addEventListener("click", applySearchFilterClick);

      document.getElementById("btnResetSearch").addEventListener("click", resetSearchAndTable);

      document.getElementById("pageSizeSelect").addEventListener("change", function () {
        state.pageSize = parseInt(this.value, 10) || 20;
        state.page = 1;
        render();
      });

      initStatCardFilters();
      render();
    })();
  </script>
</body>
</html>
