<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高端车备料</title>
  <style>
    :root {
      --page-bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #303133;
      --text-secondary: #909399;
      --border: #ebeef5;
      --primary: #409eff;
      --primary-hover: #66b1ff;
      --radius: 4px;
      --shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--page-bg);
      line-height: 1.5;
    }

    .page {
      flex: 1;
      width: 100%;
      max-width: none;
      min-height: 0;
      margin: 0;
      padding: clamp(12px, 2vw, 20px);
      padding-bottom: clamp(16px, 3vw, 28px);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .panel-material {
      flex: 1;
      min-height: 0;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-material .table-wrap {
      flex: 1;
      min-height: 0;
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: #303133;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 20px;
    }

    @media (max-width: 900px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #606266;
      margin-bottom: 6px;
    }

    .field label .req {
      color: #f56c6c;
      margin-right: 2px;
    }

    .field input,
    .field select {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text);
      background: #fff;
    }

    .field input:disabled,
    .field select:disabled {
      background: #f5f7fa;
      color: #909399;
      cursor: not-allowed;
    }

    .material-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .material-head .panel-title {
      margin: 0;
    }

    .meta-muted {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: normal;
    }

    .table-wrap {
      overflow: auto;
      margin: 0 -4px;
      -webkit-overflow-scrolling: touch;
    }

    table.data-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.data-table th,
    table.data-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    table.data-table th {
      background: #f5f7fa;
      font-weight: 600;
      color: #606266;
      white-space: nowrap;
    }

    table.data-table tbody tr:hover {
      background: #fafafa;
    }

    .cell-center {
      text-align: center;
    }

    .num-input {
      width: 100%;
      max-width: min(120px, 100%);
      height: 30px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
    }

    .num-input:disabled {
      background: #f5f7fa;
      color: #909399;
    }

    .code-input {
      width: 100%;
      max-width: min(180px, 100%);
      height: 30px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      background: #fff;
    }

    .code-input:disabled {
      background: #f5f7fa;
      color: #909399;
    }

    .badge-pick {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-pick.wait {
      background: #fdf6ec;
      color: #e6a23c;
    }

    .badge-pick.partial {
      background: #ecf5ff;
      color: #409eff;
    }

    .badge-pick.done {
      background: #f0f9eb;
      color: #67c23a;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-sm {
      min-height: 28px;
      padding: 0 12px;
      font-size: 13px;
    }

    .empty-tip {
      text-align: center;
      color: #909399;
      padding: 28px !important;
    }

    tr.row-done .num-input {
      background: #f5f7fa;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-actions">
      <button type="button" class="btn btn-primary" id="btnBack">返回</button>
      <button type="button" class="btn btn-primary" id="btnTopSave" disabled>保存</button>
      <button type="button" class="btn btn-primary" id="btnTopDone" disabled>完成</button>
    </div>

    <section class="panel" aria-labelledby="basicTitle">
      <h2 class="panel-title" id="basicTitle">基本信息</h2>
      <div class="form-grid">
        <div class="field">
          <label><span class="req">*</span>销售订单号</label>
          <input type="text" id="fSalesOrderNo" readonly disabled />
        </div>
        <div class="field">
          <label><span class="req">*</span>生产订单号</label>
          <input type="text" id="fProductionOrderNo" readonly disabled />
        </div>
        <div class="field">
          <label><span class="req">*</span>图号</label>
          <input type="text" id="fDrawingNo" readonly disabled />
        </div>
        <div class="field">
          <label><span class="req">*</span>单品码</label>
          <input type="text" id="fSingleCode" readonly disabled />
        </div>
        <div class="field">
          <label><span class="req">*</span>备料状态</label>
          <input type="text" id="fPrepStatus" readonly disabled />
        </div>
        <div class="field">
          <label><span class="req">*</span>产品名称</label>
          <input type="text" id="fProduct" readonly disabled />
        </div>
        <div class="field">
          <label><span class="req">*</span>数量</label>
          <input type="text" id="fQty" readonly disabled />
        </div>
      </div>
    </section>

    <section class="panel panel-material">
      <div class="material-head">
        <h2 class="panel-title">
          物料清单
          <span class="meta-muted" id="materialCountLabel">物料类型总数：0</span>
        </h2>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th class="cell-center" style="width:44px">
                <input type="checkbox" id="checkAllMat" title="全选" aria-label="全选物料" />
              </th>
              <th>物料码</th>
              <th>物料编码</th>
              <th>物料名称</th>
              <th>物料规格</th>
              <th>单位</th>
              <th>当前库存数量</th>
              <th>计划备料数量</th>
              <th>物料备料状态</th>
              <th>当前备料数量</th>
              <th style="min-width:140px">操作</th>
            </tr>
          </thead>
          <tbody id="matBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = "luxury_car_prep_orders_v1";

      function loadStore() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }

      function saveStore(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function padWhId(n) {
        var s = String(n);
        while (s.length < 3) s = "0" + s;
        return s;
      }

      /** 与高端车备料列表一致：缺省时按订单 id 生成单品码 */
      function ensureOrderSingleCode(o) {
        if (!o || o.singleCode) return;
        var idx = 0;
        var mid = String(o.id || "").match(/(\d+)/);
        if (mid) idx = Math.max(0, parseInt(mid[1], 10) - 1);
        o.singleCode = "SP202604" + padWhId(100 + idx);
      }

      function ensureOrderMetaFields(o) {
        if (!o) return;
        var idx = 0;
        var mid = String(o.id || "").match(/(\d+)/);
        if (mid) idx = Math.max(0, parseInt(mid[1], 10) - 1);
        if (!o.salesOrderNo) o.salesOrderNo = "SO202604" + padWhId(100 + idx);
        if (!o.productionOrderNo) o.productionOrderNo = "MO202604" + padWhId(100 + idx);
        if (!o.drawingNo) o.drawingNo = "TH-" + String(100 + idx);
      }

      function normalizedQty(v) {
        var n = parseInt(v, 10);
        if (!n || n < 1) return 1;
        return n;
      }

      function cloneMaterials(list) {
        return (Array.isArray(list) ? list : []).map(function (m) {
          var status = m.prepStatus || m.pickStatus || "待备料";
          if (status === "待领料") status = "待备料";
          if (status === "部分领料") status = "备料中";
          if (status === "领料完成") status = "备料完成";
          return {
            code: m.code || "",
            name: m.name || "",
            spec: m.spec || "",
            unit: m.unit || "",
            stockQty: m.stockQty,
            reqQty: m.reqQty,
            prepStatus: status,
            currentPrepQty: m.currentPrepQty !== undefined ? m.currentPrepQty : null,
            currentPrepInput:
              m.currentPrepInput !== undefined && m.currentPrepInput !== null
                ? String(m.currentPrepInput)
                : "",
            materialCode: m.materialCode || "",
          };
        });
      }

      function ensureOrderProducts(o) {
        if (!o) return;
        var qty = normalizedQty(o.qty);
        o.qty = qty;
        if (!Array.isArray(o.products)) o.products = [];
        var next = [];
        var i;
        for (i = 0; i < qty; i++) {
          var p = o.products[i] || {};
          next.push({
            id: p.id || ("item-" + padWhId(i + 1)),
            wholeCode: p.wholeCode || (String(o.singleCode || "SP") + "-" + padWhId(i + 1)),
            productName: p.productName || o.productName || "",
            prepStatus: p.prepStatus || o.prepStatus || "待备料",
            materials: Array.isArray(p.materials) ? p.materials : cloneMaterials(o.materials || []),
          });
        }
        o.products = next;
      }

      function syncOrderPrepStatusFromProducts(o) {
        if (!o || !Array.isArray(o.products) || !o.products.length) return;
        var allDone = o.products.every(function (p) {
          return p.prepStatus === "备料完成";
        });
        if (allDone) {
          o.prepStatus = "备料完成";
          return;
        }
        var hasStarted = o.products.some(function (p) {
          return p.prepStatus !== "待备料";
        });
        o.prepStatus = hasStarted ? "进行中" : "待备料";
      }

      function getQuery() {
        var q = {};
        location.search
          .replace(/^\?/, "")
          .split("&")
          .forEach(function (pair) {
            var p = pair.split("=");
            if (p[0]) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
          });
        return q;
      }

      var qs = getQuery();
      var orderId = qs.id || "";
      var itemId = qs.itemId || "";
      var wholeCode = qs.wholeCode || "";
      var mode = (qs.mode || "edit").toLowerCase();
      var readOnly = mode === "detail" || mode === "view";

      var store = loadStore();
      var orders = store && store.orders ? store.orders : [];
      var order = orders.filter(function (o) {
        return String(o.id) === String(orderId);
      })[0];
      var selectedItem = null;

      function persist() {
        saveStore({ orders: orders });
      }

      function activeMaterials() {
        if (selectedItem && Array.isArray(selectedItem.materials)) return selectedItem.materials;
        if (order && Array.isArray(order.materials)) return order.materials;
        return [];
      }

      function touchPrepProgressAfterPickAction() {
        if (!selectedItem) return;
        if (selectedItem.prepStatus === "待备料") selectedItem.prepStatus = "进行中";
      }

      function syncPrepStatusFromMaterials() {
        if (!selectedItem) return;
        var mats = activeMaterials();
        if (!mats.length) return;
        var allDone = mats.every(function (m) {
          return m.prepStatus === "备料完成";
        });
        if (allDone) {
          selectedItem.prepStatus = "备料完成";
        } else {
          var hasPicked = mats.some(function (m) {
            return m.prepStatus !== "待备料";
          });
          selectedItem.prepStatus = hasPicked ? "进行中" : "待备料";
        }
        syncOrderPrepStatusFromProducts(order);
      }

      function badgeClass(st) {
        if (st === "待备料") return "wait";
        if (st === "备料中") return "partial";
        if (st === "备料完成") return "done";
        return "wait";
      }

      function parseCurrentVal(str) {
        if (str === "" || str === null || str === undefined) return null;
        var n = parseFloat(String(str).trim());
        if (isNaN(n)) return NaN;
        return n;
      }

      function rowCompleted(m) {
        return m.prepStatus === "备料完成";
      }

      function bindTopActions() {
        document.getElementById("btnBack").addEventListener("click", function () {
          location.href = "高端车备料.html";
        });

        document.getElementById("btnTopSave").addEventListener("click", function () {
          if (readOnly || !order) return;
          var ids = selectedRowIds();
          if (!ids.length) {
            alert("请先勾选需要保存的物料行。");
            return;
          }
          var didSave = false;
          ids.forEach(function (rid) {
            var m = findMaterial(rid);
            if (!m || rowCompleted(m)) return;
            if (applyRowSave(m, true)) didSave = true;
          });
          if (didSave) touchPrepProgressAfterPickAction();
          syncPrepStatusFromMaterials();
          persist();
          renderForm();
          renderTable();
        });

        document.getElementById("btnTopDone").addEventListener("click", function () {
          if (readOnly || !order) return;
          var ids = selectedRowIds();
          if (!ids.length) {
            alert("请先勾选需要完成的物料行。");
            return;
          }
          var didDone = false;
          ids.forEach(function (rid) {
            var m = findMaterial(rid);
            if (!m || rowCompleted(m)) return;
            if (applyRowComplete(m)) didDone = true;
          });
          if (didDone) touchPrepProgressAfterPickAction();
          syncPrepStatusFromMaterials();
          persist();
          renderForm();
          renderTable();
        });

        var all = document.getElementById("checkAllMat");
        all.addEventListener("change", function () {
          document.querySelectorAll(".mat-check").forEach(function (cb) {
            if (!cb.disabled) cb.checked = all.checked;
          });
          syncTopButtons();
        });
      }

      function findMaterial(rowId) {
        var mats = activeMaterials();
        return mats.filter(function (m) {
          return m._rowId === rowId;
        })[0];
      }

      function selectedRowIds() {
        return Array.prototype.map
          .call(document.querySelectorAll(".mat-check:checked"), function (c) {
            return c.getAttribute("data-row");
          })
          .filter(Boolean);
      }

      function syncTopButtons() {
        var has = document.querySelectorAll(".mat-check:checked").length > 0;
        var topSave = document.getElementById("btnTopSave");
        var topDone = document.getElementById("btnTopDone");
        if (readOnly || !order) {
          topSave.disabled = true;
          topDone.disabled = true;
          return;
        }
        topSave.disabled = !has;
        topDone.disabled = !has;
      }

      function applyRowSave(m, fromBatch) {
        var code = String(m.materialCode || "").trim();
        if (!code) {
          if (!fromBatch) alert("请先输入物料码。");
          return false;
        }
        var req = Number(m.reqQty);
        var cur = parseCurrentVal(m.currentPrepInput);
        if (cur === null) {
          m.prepStatus = "备料中";
          m.currentPrepQty = null;
          return true;
        }
        if (isNaN(cur)) {
          if (!fromBatch) alert("当前备料数量请输入数字。");
          return false;
        }
        if (cur < 0) {
          if (!fromBatch) alert("当前备料数量不能小于 0。");
          return false;
        }
        if (cur > req) {
          if (!fromBatch) alert("当前备料数量不能大于计划备料数量。");
          return false;
        }
        m.currentPrepQty = cur;
        m.prepStatus = cur >= req ? "备料完成" : "备料中";
        return true;
      }

      function applyRowComplete(m) {
        var code = String(m.materialCode || "").trim();
        if (!code) return false;
        var req = Number(m.reqQty);
        m.currentPrepQty = req;
        m.currentPrepInput = String(req);
        m.prepStatus = "备料完成";
        return true;
      }

      function renderForm() {
        if (!order) return;
        document.getElementById("fSalesOrderNo").value = order.salesOrderNo || "";
        document.getElementById("fProductionOrderNo").value = order.productionOrderNo || "";
        document.getElementById("fDrawingNo").value = order.drawingNo || "";
        document.getElementById("fSingleCode").value = (selectedItem && selectedItem.wholeCode) || wholeCode || order.singleCode || "";
        document.getElementById("fPrepStatus").value = (selectedItem && selectedItem.prepStatus) || order.prepStatus || "";
        document.getElementById("fProduct").value = (selectedItem && selectedItem.productName) || order.productName || "";
        document.getElementById("fQty").value = "1";
      }

      function renderTable() {
        var tbody = document.getElementById("matBody");
        var countEl = document.getElementById("materialCountLabel");
        if (!order) {
          tbody.innerHTML =
            '<tr><td colspan="11" class="empty-tip">未找到订单数据，请从高端车备料页面进入。</td></tr>';
          countEl.textContent = "物料类型总数：0";
          return;
        }

        var mats = activeMaterials();
        countEl.textContent = "物料类型总数：" + mats.length;

        if (!mats.length) {
          tbody.innerHTML =
            '<tr><td colspan="11" class="empty-tip">暂无物料数据</td></tr>';
          return;
        }

        tbody.innerHTML = "";
        mats.forEach(function (m) {
          if (!m._rowId) m._rowId = "r-" + Math.random().toString(36).slice(2);
          var tr = document.createElement("tr");
          var done = rowCompleted(m);
          if (done) tr.classList.add("row-done");

          var curInputVal = "";
          if (m.currentPrepInput !== undefined && m.currentPrepInput !== null) {
            curInputVal = String(m.currentPrepInput);
          }

          var req = Number(m.reqQty);
          var curParsed = parseCurrentVal(curInputVal);
          var hasCode = String(m.materialCode || "").trim().length > 0;
          var canComplete = !readOnly && !done && hasCode;
          var canSave = !readOnly && !done && hasCode;

          var dis = readOnly || done;

          tr.innerHTML =
            '<td class="cell-center"><input type="checkbox" class="mat-check" data-row="' +
            m._rowId +
            '"' +
            (dis ? " disabled" : "") +
            " /></td>" +
            "<td>" +
            '<input type="text" class="code-input js-material-code" data-row="' +
            escapeAttr(m._rowId) +
            '" value="' +
            escapeAttr(m.materialCode || "") +
            '"' +
            (readOnly ? " disabled" : "") +
            " />" +
            "</td>" +
            "<td>" +
            escapeHtml(m.code || "") +
            "</td>" +
            "<td>" +
            escapeHtml(m.name || "") +
            "</td>" +
            "<td>" +
            escapeHtml(m.spec || "") +
            "</td>" +
            "<td>" +
            escapeHtml(m.unit || "") +
            "</td>" +
            "<td>" +
            escapeHtml(String(m.stockQty !== undefined && m.stockQty !== null ? m.stockQty : "")) +
            "</td>" +
            "<td>" +
            escapeHtml(String(m.reqQty !== undefined && m.reqQty !== null ? m.reqQty : "")) +
            "</td>" +
            '<td><span class="badge-pick ' +
            badgeClass(m.prepStatus || "待备料") +
            '">' +
            escapeHtml(m.prepStatus || "待备料") +
            "</span></td>" +
            "<td>" +
            '<input type="text" class="num-input js-cur" data-row="' +
            escapeAttr(m._rowId) +
            '" value="' +
            escapeAttr(curInputVal) +
            '"' +
            (dis ? " disabled" : "") +
            " />" +
            "</td>" +
            '<td><div class="row-actions">' +
            '<button type="button" class="btn btn-primary btn-sm js-save" data-row="' +
            m._rowId +
            '"' +
            (!canSave ? " disabled" : "") +
            ">保存</button>" +
            '<button type="button" class="btn btn-primary btn-sm js-done" data-row="' +
            m._rowId +
            '"' +
            (!canComplete ? " disabled" : "") +
            ">完成</button>" +
            "</div></td>";

          tbody.appendChild(tr);
        });

        tbody.querySelectorAll(".js-cur").forEach(function (inp) {
          inp.addEventListener("input", function () {
            var rid = inp.getAttribute("data-row");
            var mat = findMaterial(rid);
            if (!mat || rowCompleted(mat) || readOnly) return;
            mat.currentPrepInput = inp.value;

            var row = inp.closest("tr");
            var req = Number(mat.reqQty);
            var cp = parseCurrentVal(inp.value);
            var btnS = row.querySelector(".js-save");
            var btnD = row.querySelector(".js-done");
            var hasCodeNow = String(mat.materialCode || "").trim().length > 0;

            var canSaveNow = hasCodeNow && !isNaN(cp === null ? 0 : cp);
            var canDoneNow = hasCodeNow;
            if (cp !== null && !isNaN(cp) && cp > req) {
              canSaveNow = false;
              canDoneNow = false;
            }

            if (btnS) btnS.disabled = !canSaveNow;
            if (btnD) btnD.disabled = !canDoneNow;
          });
        });

        tbody.querySelectorAll(".js-material-code").forEach(function (inp) {
          inp.addEventListener("input", function () {
            var rid = inp.getAttribute("data-row");
            var mat = findMaterial(rid);
            if (!mat || readOnly) return;
            mat.materialCode = inp.value;
            var row = inp.closest("tr");
            var btnS = row ? row.querySelector(".js-save") : null;
            var btnD = row ? row.querySelector(".js-done") : null;
            var hasCodeNow = String(mat.materialCode || "").trim().length > 0;
            if (btnS && !rowCompleted(mat)) btnS.disabled = !hasCodeNow;
            if (btnD && !rowCompleted(mat)) btnD.disabled = !hasCodeNow;
            persist();
          });
        });

        tbody.querySelectorAll(".js-save").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var rid = btn.getAttribute("data-row");
            var mat = findMaterial(rid);
            if (!mat) return;
            if (applyRowSave(mat, false)) {
              touchPrepProgressAfterPickAction();
            }
            syncPrepStatusFromMaterials();
            persist();
            renderForm();
            renderTable();
          });
        });

        tbody.querySelectorAll(".js-done").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var rid = btn.getAttribute("data-row");
            var mat = findMaterial(rid);
            if (!mat) return;
            if (applyRowComplete(mat)) {
              touchPrepProgressAfterPickAction();
            }
            syncPrepStatusFromMaterials();
            persist();
            renderForm();
            renderTable();
          });
        });

        tbody.querySelectorAll(".mat-check").forEach(function (cb) {
          cb.addEventListener("change", syncTopButtons);
        });

        document.getElementById("checkAllMat").checked = false;
        syncTopButtons();
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function escapeAttr(s) {
        return escapeHtml(s).replace(/`/g, "&#96;");
      }

      if (!order) {
        bindTopActions();
        renderTable();
      } else {
        ensureOrderSingleCode(order);
        ensureOrderMetaFields(order);
        ensureOrderProducts(order);
        selectedItem =
          order.products.filter(function (p) {
            return String(p.id) === String(itemId);
          })[0] ||
          order.products.filter(function (p) {
            return String(p.wholeCode) === String(wholeCode);
          })[0] ||
          order.products[0] ||
          null;
        activeMaterials().forEach(function (m) {
          if (m.materialCode === undefined || m.materialCode === null) {
            m.materialCode = "";
          }
          if (m.prepStatus === undefined || m.prepStatus === null) {
            var old = m.pickStatus || "待备料";
            if (old === "待领料") old = "待备料";
            if (old === "部分领料") old = "备料中";
            if (old === "领料完成") old = "备料完成";
            m.prepStatus = old;
          }
          if (m.currentPrepInput === undefined) {
            if (m.currentPrepQty !== undefined && m.currentPrepQty !== null) {
              m.currentPrepInput = String(m.currentPrepQty);
            } else {
              m.currentPrepInput = "";
            }
          }
          if (m.currentPrepQty === undefined) {
            m.currentPrepQty = null;
          }
          if (m.prepStatus === "备料完成" && String(m.currentPrepInput || "").trim() === "") {
            m.currentPrepInput = String(m.reqQty !== undefined && m.reqQty !== null ? m.reqQty : "");
          }
          if (m.prepStatus === "备料完成" && (m.currentPrepQty === null || m.currentPrepQty === undefined)) {
            m.currentPrepQty = m.reqQty !== undefined && m.reqQty !== null ? Number(m.reqQty) : null;
          }
        });

        syncPrepStatusFromMaterials();
        persist();

        if (readOnly) {
          document.getElementById("btnTopSave").classList.add("hidden");
          document.getElementById("btnTopDone").classList.add("hidden");
          document.getElementById("checkAllMat").disabled = true;
        }

        bindTopActions();
        renderForm();
        renderTable();
      }
    })();
  </script>
</body>
</html>
