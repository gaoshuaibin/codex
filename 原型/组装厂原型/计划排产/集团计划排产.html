<body>
<div class="app">
  <div class="header">
    <div class="left"><h1>集团计划排产</h1><div class="toggle"><button class="chip active" data-view="table">表格视图</button><button class="chip" data-view="calendar">日历视图</button></div></div>
    <div class="center"><span>产线：</span><select id="lineFilter"><option value="all">全部</option><option>烤漆1线</option><option>烤漆2线</option><option>轮组线</option><option>普车组装1线</option><option>普车组装2线</option><option>电动车组装线</option><option>高端车组装线</option><option>半成品组装线</option></select><div class="date-range" style="position:relative"><button class="picker-btn active" data-period="day">日</button><button class="picker-btn" data-period="week">周</button><button class="picker-btn" data-period="month">月</button><input type="hidden" id="startDate"/><input type="hidden" id="endDate"/><button type="button" class="date-field" id="startDateTouch" tabindex="0">开始日期</button><span>至</span><button type="button" class="date-field" id="endDateTouch" tabindex="0">结束日期</button></div></div>
    <div class="right"><span class="selected" id="selectedCount">已选择 0 项</span><select id="batchStatus" disabled><option value="">批量修改状态</option><option>创建</option><option>生效</option><option>已排产</option><option>生产中</option><option>已完成</option><option>关闭</option></select><button class="btn primary" id="batchConfirm" disabled>批量确认</button><button class="btn" id="batchDelete" disabled>批量删除</button><button class="btn" id="resetFilter">重置筛选</button></div>
  </div>
  <div class="overview" id="overview"></div>
  <div class="content"><div class="table-wrap" id="tableWrap"><table><thead><tr id="headRow"></tr></thead><tbody id="tableBody"></tbody></table></div><div class="calendar-wrap" id="calendarWrap"><div class="calendar-header"><div class="calendar-nav"><button id="calendarPrev">◀ 上月</button><div id="calendarTitle"></div><button id="calendarNext">下月 ▶</button></div><div class="std-capacity-inputs"><label>烤漆产能 <input type="number" id="stdPaint" value="2800" step="100"/></label><label>轮组产能 <input type="number" id="stdWheel" value="3200" step="100"/></label><label>成品产能 <input type="number" id="stdFinal" value="3500" step="100"/></label><button class="btn" id="applyStd">应用</button></div></div><div class="calendar-grid" id="calendarGrid"></div></div></div>
</div>
<div id="topDatePopup" class="filter-popup"><div class="rp-wrap"><div class="rp-header"><button type="button" class="rp-navbtn" id="topRpPrev">‹</button><span id="topRpTitle" style="font-weight:600;color:#1a4972"></span><button type="button" class="rp-navbtn" id="topRpNext">›</button></div><div class="rp-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="rp-grid" id="topRpGrid"></div><div class="rp-hint">点选开始日期，鼠标滑过预览范围，再点结束日期；点「确定」写入导航栏日期并筛选。「清空」仅清除当前选择，可重新点选。（四页同步维护：集团/烤漆/轮组/成品计划排产.html）</div><div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn" id="topRpClear" style="flex:1">清空</button><button type="button" class="btn primary" id="topRpOk" style="flex:1">确定</button></div></div></div>
<div class="pager" id="pager"></div>
<div id="filterPopup" class="filter-popup"><div id="textFilterBox"><div class="filter-input-wrap"><input id="textFilterInput" placeholder="请输入搜索内容"/><span class="filter-clear" id="clearTextFilter">×</span></div></div><div id="dateFilterBox" style="display:none"><div class="rp-wrap"><div class="rp-header"><button type="button" class="rp-navbtn" id="rpPrev">‹</button><span id="rpTitle" style="font-weight:600;color:#1a4972"></span><button type="button" class="rp-navbtn" id="rpNext">›</button></div><div class="rp-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="rp-grid" id="rpGrid"></div><div class="rp-hint">点选开始日期，鼠标滑过预览范围，再点结束日期；点「确定」后生效。「清空」仅清除当前已选起止，不关闭弹窗，可重新选择。</div><div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn" id="rpClearCol" style="flex:1">清空本列</button></div></div></div><div class="filter-actions"><button id="cancelFilter">取消</button><button class="primary" id="confirmFilter">确定</button></div></div>
<div id="statusDropdown" class="status-dropdown"></div>
<script>
(()=>{
const pick=(a)=>a[Math.floor(Math.random()*a.length)],fmt=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const pad2=(x)=>String(x).padStart(2,"0"),ymd=(y,m,d)=>`${y}-${pad2(m)}-${pad2(d)}`,lo=(a,b)=>(a<=b?a:b),hi=(a,b)=>(a<=b?b:a);
const addDaysFrom=(s,days)=>{const [Y,M,D]=s.split("-").map(Number),t=new Date(Y,M-1,D);t.setDate(t.getDate()+days);return fmt(t);};
const todayStr=fmt(new Date());
const PRODUCT_CATS=["SKD自行车","SKD电动车","SKD高端车","CKD自行车","CKD电动车","自行车车架","电动车车架"],LINE_PAINT_OPTS=["烤漆1线","烤漆2线"],LINE_FINAL_OPTS=["普车组装1线","普车组装2线","电动车组装线","高端车组装线","半成品组装线"],ALL_HEADER_LINES=[...LINE_PAINT_OPTS,"轮组线",...LINE_FINAL_OPTS],statusesPlan=["已排产","生产中","已完成"],statusesNew=["创建","生效"];
const columns=[{k:"__check__",t:'<input type="checkbox" id="checkAll"/>'},{k:"salesOrder",t:"销售订单",type:"text"},{k:"customer",t:"客户",type:"text"},{k:"prodOrder",t:"生产订单",type:"text"},{k:"drawing",t:"图号",type:"text"},{k:"qty",t:"数量"},{k:"doneQty",t:"完成数量",type:"text"},{k:"productCategory",t:"产品类型",type:"text"},{k:"status",t:"状态",type:"status"},{k:"priority",t:"优先级",type:"text"},{k:"paintPlanStart",t:"烤漆计划开始时间",type:"date"},{k:"paintActualEnd",t:"烤漆实际完工时间",type:"date"},{k:"wheelPlanStart",t:"轮组计划开始时间",type:"date"},{k:"wheelActualEnd",t:"轮组实际完工时间",type:"date"},{k:"finalPlanStart",t:"成品计划开始时间",type:"date"},{k:"finalActualEnd",t:"成品实际完工时间",type:"date"}];
const create=(n)=>({salesOrder:`SO-2604-${1000+n}`,customer:pick(["信德","帝欧","森巴克"]),prodOrder:`PO-2604-${5000+n}`,drawing:pick(["EP-XC-120-A","FOX-32-100-1A"]),qty:100+(n%20)*10,doneQty:n%6?"":String((n%25)*10),productCategory:pick(PRODUCT_CATS),status:"创建",priority:"",paintPlanStart:"",paintActualEnd:"",wheelPlanStart:"",wheelActualEnd:"",finalPlanStart:"",finalActualEnd:""});
const paintRows=Array.from({length:500},(_,i)=>{const n=i+1,r=create(n);r.line=pick(LINE_PAINT_OPTS);r.paintPlanStart=n%4?addDaysFrom(todayStr,(n%21)-10):"";r.paintActualEnd=n%4?addDaysFrom(todayStr,(n%21)-7):"";if(r.paintPlanStart){r.priority=(n%9)+1;r.status=pick(statusesPlan);}else r.status=pick(statusesNew);return r;});
const wheelRows=Array.from({length:500},(_,i)=>{const n=i+1,r=create(n);r.line="轮组线";r.wheelPlanStart=n%4?addDaysFrom(todayStr,(n%21)-9):"";r.wheelActualEnd=n%4?addDaysFrom(todayStr,(n%21)-6):"";if(r.wheelPlanStart){r.priority=(n%9)+1;r.status=pick(statusesPlan);}else r.status=pick(statusesNew);return r;});
const finalRows=Array.from({length:500},(_,i)=>{const n=i+1,r=create(n);r.line=pick(LINE_FINAL_OPTS);r.finalPlanStart=n%3?addDaysFrom(todayStr,(n%19)-8):"";r.finalActualEnd=n%3?addDaysFrom(todayStr,(n%19)-5):"";if(r.finalPlanStart){r.priority=(n%9)+1;r.status=pick(statusesPlan);}else r.status=pick(statusesNew);return r;});
let rows=[...paintRows,...wheelRows,...finalRows].map((r,i)=>({id:i+1,...r})),filtered=rows.slice(),selected=new Set(),page=1,pageSize=20,cy=new Date().getFullYear(),cm=new Date().getMonth(),stdPaint=2800,stdWheel=3200,stdFinal=3500;
const LS_GROUP="plan_group_rows_v1";function persistGroupRows(){try{localStorage.setItem(LS_GROUP,JSON.stringify({rows}));}catch(_){}}
try{const raw=localStorage.getItem(LS_GROUP);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.rows)&&d.rows.length){rows=d.rows;rows.forEach(r=>{if(!r.line){if(r.finalPlanStart||r.finalActualEnd)r.line=pick(LINE_FINAL_OPTS);else if(r.wheelPlanStart||r.wheelActualEnd)r.line="轮组线";else if(r.paintPlanStart||r.paintActualEnd)r.line=pick(LINE_PAINT_OPTS);else r.line=pick(ALL_HEADER_LINES);}});}}}catch(_){}
const topFilter={line:"all",start:"",end:""},colFilter={},popupState={key:"",type:""};let rpYear=new Date().getFullYear(),rpMonth=new Date().getMonth(),rpStart=null,rpEnd=null,rpHover=null,topRpYear=new Date().getFullYear(),topRpMonth=new Date().getMonth(),topRpStart=null,topRpEnd=null,topRpHover=null;const $=(id)=>document.getElementById(id);function closeTopDatePopup(){$("topDatePopup").style.display="none";}
const STATUS_OPTS=[{v:"",l:"全部"},{v:"创建",l:"创建"},{v:"生效",l:"生效"},{v:"已排产",l:"已排产"},{v:"生产中",l:"生产中"},{v:"已完成",l:"已完成"},{v:"关闭",l:"关闭"}];
function closeStatusDropdown(){$("statusDropdown").style.display="none";}
function openStatusDropdown(icon,ev){ev.stopPropagation();closePopup();closeTopDatePopup();const cur=(colFilter.status&&colFilter.status.value)||"";const dd=$("statusDropdown");dd.innerHTML=STATUS_OPTS.map(o=>`<button type="button" class="status-opt${cur===o.v?" sel":""}" data-val="${o.v}">${o.l}</button>`).join("");const rect=icon.getBoundingClientRect();dd.style.display="block";dd.style.left=`${Math.max(8,Math.min(window.innerWidth-148,rect.left))}px`;dd.style.top=`${rect.bottom+4}px`;}
function bindDatePickers(root=document){root.querySelectorAll('input[type="date"]').forEach(inp=>{if(inp.dataset.boundPicker)return;inp.dataset.boundPicker="1";const open=()=>{if(typeof inp.showPicker==="function"){try{inp.showPicker();}catch(_){}}};inp.addEventListener("focus",open);inp.addEventListener("click",open);});}
function syncTopDateLabels(){const s=$("startDate").value||"",e=$("endDate").value||"";$("startDateTouch").textContent=s||"开始日期";$("endDateTouch").textContent=e||"结束日期";}
function setTopRange(period){const t=new Date();let s=new Date(t),e=new Date(t);if(period==="week"){const w=t.getDay()||7;s.setDate(s.getDate()-w+1);e=new Date(s);e.setDate(e.getDate()+6);}if(period==="month"){s=new Date(t.getFullYear(),t.getMonth(),1);e=new Date(t.getFullYear(),t.getMonth()+1,0);}$("startDate").value=fmt(s);$("endDate").value=fmt(e);topFilter.start=$("startDate").value;topFilter.end=$("endDate").value;syncTopDateLabels();}
function isScheduled(r){return !!(r.paintPlanStart||r.wheelPlanStart||r.finalPlanStart);}function rowDeliveryDate(r){return r.finalPlanStart||r.wheelPlanStart||r.paintPlanStart||"";}
function matchColumnFilter(r){for(const k of Object.keys(colFilter)){const f=colFilter[k],v=(r[k]||"").toString();if(f.type==="text"&&v.toLowerCase().indexOf(f.value.toLowerCase())===-1)return false;if(f.type==="date"){if(f.start&&(!v||v<f.start))return false;if(f.end&&(!v||v>f.end))return false;}if(f.type==="status"&&f.value&&v!==f.value)return false;}return true;}
function applyFilter(){topFilter.line=$("lineFilter").value;topFilter.start=$("startDate").value;topFilter.end=$("endDate").value;filtered=rows.filter(r=>{const d=rowDeliveryDate(r),lineOk=topFilter.line==="all"||r.line===topFilter.line,dateOk=(!topFilter.start||!d||d>=topFilter.start)&&(!topFilter.end||!d||d<=topFilter.end);return lineOk&&dateOk&&matchColumnFilter(r)});page=1;render();persistGroupRows();}
function renderHeader(){$("headRow").innerHTML=columns.map(c=>{if(c.k==="__check__")return`<th>${c.t}</th>`;const active=colFilter[c.k]?"active":"";const withIcon=c.k!=="qty";return`<th><div class="th-title">${c.t}${withIcon?`<span class="sicon ${active}" data-key="${c.k}" data-type="${c.type||"text"}">🔍</span>`:""}</div></th>`;}).join("");$("checkAll").addEventListener("change",(ev)=>{filtered.slice((page-1)*pageSize,page*pageSize).forEach(r=>ev.target.checked?selected.add(r.id):selected.delete(r.id));renderTable();updateSelected();});document.querySelectorAll(".sicon").forEach(icon=>icon.addEventListener("click",(e)=>openPopup(icon,e)));}
function renderTable(){const total=Math.max(1,Math.ceil(filtered.length/pageSize));if(page>total)page=total;const part=filtered.slice((page-1)*pageSize,page*pageSize);$("tableBody").innerHTML=part.map(r=>`<tr><td><input type="checkbox" class="row-check" data-id="${r.id}" ${selected.has(r.id)?"checked":""}/></td>${columns.slice(1).map(c=>`<td>${r[c.k]||""}</td>`).join("")}</tr>`).join("");$("checkAll").checked=part.length>0&&part.every(r=>selected.has(r.id));document.querySelectorAll(".row-check").forEach(cb=>cb.addEventListener("change",()=>{const id=Number(cb.dataset.id);cb.checked?selected.add(id):selected.delete(id);updateSelected();}));}
function renderPager(){const total=Math.max(1,Math.ceil(filtered.length/pageSize));if(page>total)page=total;const pages=[];for(let i=1;i<=Math.min(6,total);i++)pages.push(i);if(total>6)pages.push("...",total);$("pager").innerHTML=`<span>共 ${filtered.length} 条</span><select id="pageSize"><option value="20" ${pageSize===20?"selected":""}>20</option><option value="50" ${pageSize===50?"selected":""}>50</option></select><button class="page-btn" id="prevPage">‹</button>${pages.map(p=>typeof p==="number"?`<button class="page-btn ${p===page?"active":""}" data-page="${p}">${p}</button>`:`<button class="page-btn" disabled>...</button>`).join("")}<button class="page-btn" id="nextPage">›</button>`;$("pageSize").addEventListener("change",(e)=>{pageSize=Number(e.target.value)||20;page=1;render();});$("prevPage").addEventListener("click",()=>{if(page>1){page--;render();}});$("nextPage").addEventListener("click",()=>{if(page<total){page++;render();}});$("pager").querySelectorAll("[data-page]").forEach(btn=>btn.addEventListener("click",()=>{page=Number(btn.dataset.page);render();}));}
function renderOverview(){const scheduled=filtered.filter(isScheduled),plannedOrders=scheduled.length,plannedQty=scheduled.reduce((s,r)=>s+r.qty,0),runningQty=filtered.filter(r=>r.status==="生产中").reduce((s,r)=>s+r.qty,0),doneQtyStat=filtered.filter(r=>r.status==="已完成").reduce((s,r)=>s+r.qty,0),needQty=Math.max(0,plannedQty-runningQty-doneQtyStat),progress=plannedQty?Math.round((doneQtyStat/plannedQty)*100):0,startDelay=filtered.filter(r=>(r.paintActualEnd&&r.paintPlanStart&&r.paintActualEnd>r.paintPlanStart)||(r.wheelActualEnd&&r.wheelPlanStart&&r.wheelActualEnd>r.wheelPlanStart)||(r.finalActualEnd&&r.finalPlanStart&&r.finalActualEnd>r.finalPlanStart)).length,deliveryDelay=filtered.filter(r=>(r.paintActualEnd&&r.paintPlanStart&&r.paintActualEnd>r.paintPlanStart)||(r.wheelActualEnd&&r.wheelPlanStart&&r.wheelActualEnd>r.wheelPlanStart)||(r.finalActualEnd&&r.finalPlanStart&&r.finalActualEnd>r.finalPlanStart)).length;$("overview").innerHTML=`<span style="font-weight:700;color:#1a4972">排产总览：</span><span>订单总数 <b>${filtered.length}</b></span><span>已排产订单 <b>${plannedOrders}</b></span><span>已排产产品数量 <b>${plannedQty}</b></span><span>生产中产品数量 <b>${runningQty}</b></span><span>已完成产品数量 <b>${doneQtyStat}</b></span><span>需投产产品数量 <b>${needQty}</b></span><span>生产总进度 <b>${progress}%</b></span><span>完工滞后订单 <b>${startDelay}</b></span><span>交付滞后订单 <b>${deliveryDelay}</b></span>`;}
function renderCalendar(){const first=new Date(cy,cm,1),days=new Date(cy,cm+1,0).getDate(),sw=first.getDay(),prevDays=new Date(cy,cm,0).getDate(),cap={};filtered.forEach(r=>{if(r.paintPlanStart){cap[r.paintPlanStart]=cap[r.paintPlanStart]||{paint:0,wheel:0,final:0};cap[r.paintPlanStart].paint+=r.qty;}if(r.wheelPlanStart){cap[r.wheelPlanStart]=cap[r.wheelPlanStart]||{paint:0,wheel:0,final:0};cap[r.wheelPlanStart].wheel+=r.qty;}if(r.finalPlanStart){cap[r.finalPlanStart]=cap[r.finalPlanStart]||{paint:0,wheel:0,final:0};cap[r.finalPlanStart].final+=r.qty;}});let monthTotal=0;for(let d=1;d<=days;d++){const ds=`${cy}-${String(cm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;if(cap[ds])monthTotal+=cap[ds].paint+cap[ds].wheel+cap[ds].final;}$("calendarTitle").innerHTML=`<b>${cy}年${String(cm+1).padStart(2,"0")}月</b> <span style="font-size:12px;background:#eef3fc;padding:2px 8px;border-radius:20px">总排产数量 ${monthTotal}</span>`;let html=["日","一","二","三","四","五","六"].map(w=>`<div class="weekday">周${w}</div>`).join("");let day=1,next=1;for(let i=0;i<42;i++){let dn,cur=true,ds;if(i<sw){dn=prevDays-(sw-i)+1;cur=false;const pm=cm===0?11:cm-1,py=cm===0?cy-1:cy;ds=`${py}-${String(pm+1).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;}else if(day<=days){dn=day++;ds=`${cy}-${String(cm+1).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;}else{dn=next++;cur=false;const nm=cm===11?0:cm+1,ny=cm===11?cy+1:cy;ds=`${ny}-${String(nm+1).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;}const c=cap[ds]||{paint:0,wheel:0,final:0};let lines="";if(c.paint>0)lines+=`<div class="sub-row"><span class="sub-l">烤漆</span><span class="sub-c">${c.paint}</span><span class="sub-r">${stdPaint?((c.paint/stdPaint)*100).toFixed(1):"0.0"}%</span></div>`;if(c.wheel>0)lines+=`<div class="sub-row"><span class="sub-l">轮组</span><span class="sub-c">${c.wheel}</span><span class="sub-r">${stdWheel?((c.wheel/stdWheel)*100).toFixed(1):"0.0"}%</span></div>`;if(c.final>0)lines+=`<div class="sub-row"><span class="sub-l">成品</span><span class="sub-c">${c.final}</span><span class="sub-r">${stdFinal?((c.final/stdFinal)*100).toFixed(1):"0.0"}%</span></div>`;html+=`<div class="day" style="${cur?"":"opacity:.45"}"><div class="day-number">${dn}</div>${lines?`<div class="sub">${lines}</div>`:""}</div>`;}$("calendarGrid").innerHTML=html;}
function updateSelected(){const c=selected.size;$("selectedCount").textContent=`已选择 ${c} 项`;["batchStatus","batchConfirm","batchDelete"].forEach(id=>$(id).disabled=c===0);}
function updateRpTitle(){$("rpTitle").textContent=`${rpYear}年${pad2(rpMonth+1)}月`;}
function renderRpGrid(){const first=new Date(rpYear,rpMonth,1),sw=first.getDay(),dim=new Date(rpYear,rpMonth+1,0).getDate(),prevDim=new Date(rpYear,rpMonth,0).getDate();let day=1,next=1,html="";const today=fmt(new Date());let ra="",rb="";if(rpStart){if(rpEnd){ra=lo(rpStart,rpEnd);rb=hi(rpStart,rpEnd);}else{ra=lo(rpStart,rpHover||rpStart);rb=hi(rpStart,rpHover||rpStart);}}for(let i=0;i<42;i++){let dn,cur,ds;if(i<sw){dn=prevDim-(sw-i)+1;cur=false;const pm=rpMonth===0?11:rpMonth-1,py=rpMonth===0?rpYear-1:rpYear;ds=ymd(py,pm+1,dn);}else if(day<=dim){dn=day++;cur=true;ds=ymd(rpYear,rpMonth+1,dn);}else{dn=next++;cur=false;const nm=rpMonth===11?0:rpMonth+1,ny=rpMonth===11?rpYear+1:rpYear;ds=ymd(ny,nm+1,dn);}let cls="rp-cell"+(cur?"":" other")+(ds===today?" today":"");if(rpStart&&ds>=ra&&ds<=rb)cls+=" in-range";if(rpStart&&ds===rpStart)cls+=" anchor";if(rpStart){const pe=(!rpEnd&&rpHover&&rpHover!==rpStart&&ds===rpHover)||(rpEnd&&rpEnd!==rpStart&&ds===rpEnd);if(pe)cls+=" preview-end";}html+=`<div class="${cls}" data-ds="${ds}">${dn}</div>`;}$("rpGrid").innerHTML=html;$("rpGrid").querySelectorAll(".rp-cell").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();rpCellClick(el.dataset.ds);});el.addEventListener("mouseenter",e=>{e.stopPropagation();if(rpStart&&!rpEnd&&el.dataset.ds!==rpHover){rpHover=el.dataset.ds;renderRpGrid();}});});}
function rpCellClick(ds){if(!rpStart){rpStart=ds;rpEnd=null;rpHover=ds;renderRpGrid();return;}if(!rpEnd){rpEnd=ds;rpHover=ds;renderRpGrid();return;}rpStart=ds;rpEnd=null;rpHover=ds;renderRpGrid();}
function updateTopRpTitle(){$("topRpTitle").textContent=`${topRpYear}年${pad2(topRpMonth+1)}月`;}
function renderTopRpGrid(){const first=new Date(topRpYear,topRpMonth,1),sw=first.getDay(),dim=new Date(topRpYear,topRpMonth+1,0).getDate(),prevDim=new Date(topRpYear,topRpMonth,0).getDate();let day=1,next=1,html="";const today=fmt(new Date());let ra="",rb="";if(topRpStart){if(topRpEnd){ra=lo(topRpStart,topRpEnd);rb=hi(topRpStart,topRpEnd);}else{ra=lo(topRpStart,topRpHover||topRpStart);rb=hi(topRpStart,topRpHover||topRpStart);}}for(let i=0;i<42;i++){let dn,cur,ds;if(i<sw){dn=prevDim-(sw-i)+1;cur=false;const pm=topRpMonth===0?11:topRpMonth-1,py=topRpMonth===0?topRpYear-1:topRpYear;ds=ymd(py,pm+1,dn);}else if(day<=dim){dn=day++;cur=true;ds=ymd(topRpYear,topRpMonth+1,dn);}else{dn=next++;cur=false;const nm=topRpMonth===11?0:topRpMonth+1,ny=topRpMonth===11?topRpYear+1:topRpYear;ds=ymd(ny,nm+1,dn);}let cls="rp-cell"+(cur?"":" other")+(ds===today?" today":"");if(topRpStart&&ds>=ra&&ds<=rb)cls+=" in-range";if(topRpStart&&ds===topRpStart)cls+=" anchor";if(topRpStart){const pe=(!topRpEnd&&topRpHover&&topRpHover!==topRpStart&&ds===topRpHover)||(topRpEnd&&topRpEnd!==topRpStart&&ds===topRpEnd);if(pe)cls+=" preview-end";}html+=`<div class="${cls}" data-ds="${ds}">${dn}</div>`;}$("topRpGrid").innerHTML=html;$("topRpGrid").querySelectorAll(".rp-cell").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();topRpCellClick(el.dataset.ds);});el.addEventListener("mouseenter",e=>{e.stopPropagation();if(topRpStart&&!topRpEnd&&el.dataset.ds!==topRpHover){topRpHover=el.dataset.ds;renderTopRpGrid();}});});}
function topRpCellClick(ds){if(!topRpStart){topRpStart=ds;topRpEnd=null;topRpHover=ds;renderTopRpGrid();return;}if(!topRpEnd){topRpEnd=ds;topRpHover=ds;renderTopRpGrid();return;}topRpStart=ds;topRpEnd=null;topRpHover=ds;renderTopRpGrid();}
function openPopup(icon,ev){ev.stopPropagation();if(icon.dataset.type==="status"){openStatusDropdown(icon,ev);return;}closeStatusDropdown();closeTopDatePopup();popupState.key=icon.dataset.key;popupState.type=icon.dataset.type;const box=$("filterPopup"),rect=icon.getBoundingClientRect();box.style.left=`${Math.max(8,Math.min(window.innerWidth-288,rect.left))}px`;box.style.top=`${rect.bottom+6}px`;box.style.display="block";const isDate=popupState.type==="date";$("dateFilterBox").style.display=isDate?"block":"none";$("textFilterBox").style.display=isDate?"none":"block";if(isDate){rpStart=null;rpEnd=null;rpHover=null;const f=colFilter[popupState.key];if(f&&f.type==="date"&&(f.start||f.end)){const xs=f.start||f.end,xe=f.end||f.start;const a=lo(xs,xe),b=hi(xs,xe);if(a===b){rpStart=a;rpEnd=null;}else{rpStart=a;rpEnd=b;}const p=a.split("-").map(Number);rpYear=p[0];rpMonth=p[1]-1;}else{const t=new Date();rpYear=t.getFullYear();rpMonth=t.getMonth();}updateRpTitle();renderRpGrid();}else{$("textFilterInput").value=(colFilter[popupState.key]&&colFilter[popupState.key].value)||"";bindDatePickers(box);}}
function closePopup(){$("filterPopup").style.display="none";popupState.key="";popupState.type="";rpStart=null;rpEnd=null;rpHover=null;}
function render(){renderHeader();renderTable();renderPager();renderOverview();updateSelected();bindDatePickers();if($("calendarWrap").style.display==="block")renderCalendar();}
setTopRange("day");syncTopDateLabels();applyFilter();
$("lineFilter").addEventListener("change",applyFilter);
document.querySelectorAll(".picker-btn").forEach(btn=>btn.addEventListener("click",()=>{closeTopDatePopup();document.querySelectorAll(".picker-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");setTopRange(btn.dataset.period);applyFilter();}));
$("resetFilter").addEventListener("click",()=>{closeStatusDropdown();closeTopDatePopup();$("lineFilter").value="all";Object.keys(colFilter).forEach(k=>delete colFilter[k]);selected.clear();document.querySelectorAll(".picker-btn").forEach(b=>b.classList.remove("active"));document.querySelector('.picker-btn[data-period="day"]').classList.add("active");setTopRange("day");applyFilter();});
$("batchConfirm").addEventListener("click",()=>{const s=$("batchStatus").value;if(!s)return;rows.forEach(r=>{if(selected.has(r.id))r.status=s;});selected.clear();applyFilter();});
$("batchDelete").addEventListener("click",()=>{rows=rows.filter(r=>!selected.has(r.id));selected.clear();applyFilter();});
document.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{closeTopDatePopup();document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b===btn));const isTable=btn.dataset.view==="table";$("tableWrap").style.display=isTable?"block":"none";$("calendarWrap").style.display=isTable?"none":"block";$("pager").style.display=isTable?"flex":"none";if(!isTable)renderCalendar();}));
$("calendarPrev").addEventListener("click",()=>{if(cm===0){cm=11;cy--;}else cm--;renderCalendar();});$("calendarNext").addEventListener("click",()=>{if(cm===11){cm=0;cy++;}else cm++;renderCalendar();});
$("applyStd").addEventListener("click",()=>{stdPaint=parseInt($("stdPaint").value,10)||2800;stdWheel=parseInt($("stdWheel").value,10)||3200;stdFinal=parseInt($("stdFinal").value,10)||3500;renderCalendar();});
$("clearTextFilter").addEventListener("click",()=>{$("textFilterInput").value="";});$("cancelFilter").addEventListener("click",closePopup);
$("statusDropdown").addEventListener("click",(e)=>{const b=e.target.closest(".status-opt");if(!b)return;e.stopPropagation();const v=b.getAttribute("data-val")||"";if(v)colFilter.status={type:"status",value:v};else delete colFilter.status;closeStatusDropdown();applyFilter();});
$("confirmFilter").addEventListener("click",()=>{if(!popupState.key)return;if(popupState.type==="date"){if(rpStart){const st=lo(rpStart,rpEnd||rpStart),en=hi(rpStart,rpEnd||rpStart);colFilter[popupState.key]={type:"date",start:st,end:en};}else delete colFilter[popupState.key];rpStart=null;rpEnd=null;rpHover=null;}else{const v=$("textFilterInput").value.trim();if(v)colFilter[popupState.key]={type:"text",value:v};else delete colFilter[popupState.key];}closePopup();applyFilter();});
$("rpPrev").addEventListener("click",e=>{e.stopPropagation();rpStart=null;rpEnd=null;rpHover=null;if(rpMonth===0){rpMonth=11;rpYear--;}else rpMonth--;updateRpTitle();renderRpGrid();});
$("rpNext").addEventListener("click",e=>{e.stopPropagation();rpStart=null;rpEnd=null;rpHover=null;if(rpMonth===11){rpMonth=0;rpYear++;}else rpMonth++;updateRpTitle();renderRpGrid();});
$("rpClearCol").addEventListener("click",e=>{e.stopPropagation();rpStart=null;rpEnd=null;rpHover=null;renderRpGrid();});
function openTopDatePickerPanel(){closePopup();closeStatusDropdown();const p=$("topDatePopup");if(p.style.display==="block"){closeTopDatePopup();return;}const s=$("startDate").value,ed=$("endDate").value;topRpStart=topRpEnd=topRpHover=null;if(s&&ed){const a=lo(s,ed),b=hi(s,ed);if(a===b)topRpStart=a;else{topRpStart=a;topRpEnd=b;}}else if(s)topRpStart=s;const seed=topRpStart||s||ed||fmt(new Date()),parts=seed.split("-").map(Number);topRpYear=parts[0];topRpMonth=parts[1]-1;const dr=document.querySelector(".date-range").getBoundingClientRect();p.style.left=`${Math.max(8,Math.min(window.innerWidth-288,dr.left))}px`;p.style.top=`${dr.bottom+6}px`;p.style.display="block";updateTopRpTitle();renderTopRpGrid();}
$("startDateTouch").addEventListener("click",e=>{e.stopPropagation();openTopDatePickerPanel();});
$("endDateTouch").addEventListener("click",e=>{e.stopPropagation();openTopDatePickerPanel();});
$("topRpClear").addEventListener("click",e=>{e.stopPropagation();topRpStart=null;topRpEnd=null;topRpHover=null;renderTopRpGrid();});
$("topRpOk").addEventListener("click",e=>{e.stopPropagation();if(topRpStart){const st=lo(topRpStart,topRpEnd||topRpStart),en=hi(topRpStart,topRpEnd||topRpStart);$("startDate").value=st;$("endDate").value=en;}else{$("startDate").value="";$("endDate").value="";}syncTopDateLabels();closeTopDatePopup();topRpStart=topRpEnd=topRpHover=null;applyFilter();});
$("topRpPrev").addEventListener("click",e=>{e.stopPropagation();topRpStart=null;topRpEnd=null;topRpHover=null;if(topRpMonth===0){topRpMonth=11;topRpYear--;}else topRpMonth--;updateTopRpTitle();renderTopRpGrid();});
$("topRpNext").addEventListener("click",e=>{e.stopPropagation();topRpStart=null;topRpEnd=null;topRpHover=null;if(topRpMonth===11){topRpMonth=0;topRpYear++;}else topRpMonth++;updateTopRpTitle();renderTopRpGrid();});
document.addEventListener("click",(e)=>{if($("statusDropdown").style.display==="block"&&!e.target.closest("#statusDropdown")&&!e.target.closest('.sicon[data-type="status"]'))closeStatusDropdown();if($("filterPopup").style.display==="block"&&!$("filterPopup").contains(e.target)&&!e.target.closest(".sicon"))closePopup();if($("topDatePopup").style.display==="block"&&!e.target.closest("#topDatePopup")&&!e.target.closest(".date-range"))closeTopDatePopup();});
})();
</script>
