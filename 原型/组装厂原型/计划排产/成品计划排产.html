<body>
<div class="app">
  <div class="header">
    <div class="left"><h1>成品计划排产</h1><div class="toggle"><button class="chip active" data-view="table">表格视图</button><button class="chip" data-view="calendar">日历视图</button></div></div>
    <div class="center"><span>产线：</span><select id="lineFilter"><option value="all">全部</option><option>普车组装1线</option><option>普车组装2线</option><option>电动车组装线</option><option>高端车组装线</option><option>半成品组装线</option></select><div class="date-range" style="position:relative"><button class="picker-btn active" data-period="day">日</button><button class="picker-btn" data-period="week">周</button><button class="picker-btn" data-period="month">月</button><input type="hidden" id="startDate"/><input type="hidden" id="endDate"/><button type="button" class="date-field" id="startDateTouch" tabindex="0">开始日期</button><span>至</span><button type="button" class="date-field" id="endDateTouch" tabindex="0">结束日期</button></div></div>
    <div class="right"><span class="selected" id="selectedCount">已选择 0 项</span><select id="batchStatus" disabled><option value="">批量修改状态</option><option>创建</option><option>生效</option><option>已排产</option><option>生产中</option><option>已完成</option><option>关闭</option></select><button class="btn primary" id="batchConfirm" disabled>批量确认</button><button class="btn" id="batchDelete" disabled>批量删除</button><button class="btn" id="resetFilter">重置筛选</button></div>
  </div>
  <div class="overview" id="overview"></div>
  <div class="content">
    <div class="table-wrap" id="tableWrap"><table><thead><tr id="headRow"></tr></thead><tbody id="tableBody"></tbody></table></div>
    <div class="calendar-wrap" id="calendarWrap">
      <div class="calendar-header">
        <div class="calendar-nav-row">
          <div class="calendar-nav"><button id="calendarPrev">◀ 上月</button><div id="calendarTitle"></div><button id="calendarNext">下月 ▶</button></div>
          <div class="std-capacity-inputs">
            <label>SKD自行车 <input type="number" id="capSdkBike" value="800" step="100"/></label>
            <label>SKD电动车 <input type="number" id="capSdkEv" value="800" step="100"/></label>
            <label>SKD高端车 <input type="number" id="capSdkPremium" value="800" step="100"/></label>
            <label>CKD自行车 <input type="number" id="capCkdBike" value="800" step="100"/></label>
            <label>CKD电动车 <input type="number" id="capCkdEv" value="800" step="100"/></label>
            <label>自行车车架 <input type="number" id="capFrameBike" value="800" step="100"/></label>
            <label>电动车车架 <input type="number" id="capFrameEv" value="800" step="100"/></label>
            <button class="btn" id="applyCap">应用</button>
          </div>
        </div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>
</div>
<div id="topDatePopup" class="filter-popup"><div class="rp-wrap"><div class="rp-header"><button type="button" class="rp-navbtn" id="topRpPrev">‹</button><span id="topRpTitle" style="font-weight:600;color:#1a4972"></span><button type="button" class="rp-navbtn" id="topRpNext">›</button></div><div class="rp-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="rp-grid" id="topRpGrid"></div><div class="rp-hint">点选开始日期，鼠标滑过预览范围，再点结束日期；点「确定」写入导航栏日期并筛选。「清空」仅清除当前选择。（四页同步：集团/烤漆/轮组/成品计划排产.html）</div><div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn" id="topRpClear" style="flex:1">清空</button><button type="button" class="btn primary" id="topRpOk" style="flex:1">确定</button></div></div></div>
<div id="cellDatePopup" class="filter-popup" style="z-index:10002"><div class="rp-wrap"><div class="rp-header"><button type="button" class="rp-navbtn" id="cellPickPrev">‹</button><span id="cellPickTitle" style="font-weight:600;color:#1a4972"></span><button type="button" class="rp-navbtn" id="cellPickNext">›</button></div><div class="rp-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="rp-grid" id="cellPickGrid"></div><div class="rp-hint" style="margin-top:6px">点击选择日期；与日历视图「周日」勾选联动，勾选时日列为置灰不可选。</div></div></div>
<div class="pager" id="pager"></div>
<div id="filterPopup" class="filter-popup">
  <div id="textFilterBox"><div class="filter-input-wrap"><input id="textFilterInput" placeholder="请输入搜索内容"/><span class="filter-clear" id="clearTextFilter">×</span></div></div>
  <div id="dateFilterBox" style="display:none"><div class="rp-wrap"><div class="rp-header"><button type="button" class="rp-navbtn" id="rpPrev">‹</button><span id="rpTitle" style="font-weight:600;color:#1a4972"></span><button type="button" class="rp-navbtn" id="rpNext">›</button></div><div class="rp-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="rp-grid" id="rpGrid"></div><div class="rp-hint">点选开始日期，鼠标滑过预览范围，再点结束日期；点「确定」后生效。「清空本列」仅清除当前已选起止，不关闭弹窗。</div><div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn" id="rpClearCol" style="flex:1">清空本列</button></div></div></div>

<div id="categoryFilterDropdown" class="status-dropdown"></div>

<script>
(()=>{
  const pick=(a)=>a[Math.floor(Math.random()*a.length)],fmt=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const pad2=(x)=>String(x).padStart(2,"0"),ymd=(y,m,d)=>`${y}-${pad2(m)}-${pad2(d)}`,lo=(a,b)=>(a<=b?a:b),hi=(a,b)=>(a<=b?b:a);
  const addDaysFrom=(s,days)=>{const [Y,M,D]=s.split("-").map(Number),t=new Date(Y,M-1,D);t.setDate(t.getDate()+days);return fmt(t);};
  const todayStr=fmt(new Date());
  let skipSundayState=true;
  function parseDS(ds){const p=ds.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
  function isSundayDs(ds){return parseDS(ds).getDay()===0;}
  function skipSundayBlocked(){const el=document.getElementById("skipSundayCalChk");return el?!!el.checked:skipSundayState;}
  function addProductionDaysForward(startStr,nFwd){if(!startStr||nFwd<=0)return startStr;let cur=parseDS(startStr);let n=nFwd;while(n>0){cur.setDate(cur.getDate()+1);if(skipSundayBlocked()&&cur.getDay()===0)continue;n--;}return fmt(cur);}
  function addProductionDaysBackward(endStr,nBack){if(!endStr||nBack<=0)return endStr;let cur=parseDS(endStr);let n=nBack;while(n>0){cur.setDate(cur.getDate()-1);if(skipSundayBlocked()&&cur.getDay()===0)continue;n--;}return fmt(cur);}
  const PRODUCT_CATS=["SKD自行车","SKD电动车","SKD高端车","CKD自行车","CKD电动车","自行车车架","电动车车架"],SKD_CATS=["SKD自行车","SKD电动车","SKD高端车"],CKD_CATS=["CKD自行车","CKD电动车"],FRAME_CATS=["自行车车架","电动车车架"],LINE_OPTS=["普车组装1线","普车组装2线","电动车组装线","高端车组装线","半成品组装线"],statusesPlan=["已排产","生产中","已完成"],statusesNew=["创建","生效"];
  function catForLine(ln,seed){const sid=Number(seed)||0;if(!ln)return PRODUCT_CATS[sid%PRODUCT_CATS.length];if(ln==="半成品组装线")return [...CKD_CATS,...FRAME_CATS][sid%4];if(ln==="高端车组装线")return "SKD高端车";if(ln==="电动车组装线")return sid%2===0?"SKD电动车":"电动车车架";const pu=["SKD自行车","SKD电动车","SKD高端车"];return pu[sid%pu.length];}
  function escapeAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
  function daysInclusive(sa,sb){if(!sa||!sb)return 0;const x=lo(sa,sb),y=hi(sa,sb);if(!skipSundayBlocked()){const [y1,m1,d1]=x.split("-").map(Number),[y2,m2,d2]=y.split("-").map(Number);const a=new Date(y1,m1-1,d1),b=new Date(y2,m2-1,d2);return Math.max(0,Math.round((b-a)/86400000))+1;}let cnt=0;const cur=parseDS(x),end=parseDS(y);while(cur<=end){if(cur.getDay()!==0)cnt++;cur.setDate(cur.getDate()+1);}return cnt;}
  function planEndFromStartDuration(startStr,durStr){const d=parseInt(durStr,10);if(!startStr||!(d>=1))return "";if(!skipSundayBlocked())return addDaysFrom(startStr,Math.max(0,d-1));return addProductionDaysForward(startStr,Math.max(0,d-1));}

  function accumulateLineCatDays(r,daily){if(!r.start||r.parentId)return;const cat=r.productCategory||"",ln=r.line||"";if(!cat||!ln)return;const qty=effectiveQty(r);if(qty<=0)return;const pe=r.planEnd||r.start;const a=lo(r.start,pe),b=hi(r.start,pe);const dates=enumerateAllocationDates(a,b);if(!dates.length)return;const parts=splitQtyAcrossDays(qty,dates.length);dates.forEach((ds,i)=>{daily[ds]=daily[ds]||{};daily[ds][ln]=daily[ds][ln]||{};daily[ds][ln][cat]=(daily[ds][ln][cat]||0)+parts[i];});}
  function renderCalendar(){syncCatCapFromInputs();const st0=document.getElementById("skipSundayCalChk");if(st0)skipSundayState=st0.checked;const first=new Date(cy,cm,1),days=new Date(cy,cm+1,0).getDate(),sw=first.getDay(),prevDays=new Date(cy,cm,0).getDate();const daily={};parentsForCalendar().forEach(r=>accumulateLineCatDays(r,daily));let monthTotal=0;for(let d=1;d<=days;d++){const ds=`${cy}-${pad2(cm+1)}-${pad2(d)}`;if(daily[ds])Object.keys(daily[ds]).forEach(ln=>Object.values(daily[ds][ln]).forEach(v=>{monthTotal+=v;}));}$("calendarTitle").innerHTML=`<b>${cy}年${pad2(cm+1)}月</b> <span style="font-size:12px;background:#eef3fc;padding:2px 8px;border-radius:20px">总排产数量 ${monthTotal}</span>`;let html=`<div class="weekday weekday-sun"><label class="skip-sun-label" title="勾选：跳过周日排产；取消勾选：表格可选周日且日历可对周日分摊（已填计划不随勾选改动）"><input type="checkbox" id="skipSundayCalChk" ${skipSundayState?"checked":""}/>周日</label></div>`;html+=["一","二","三","四","五","六"].map(w=>`<div class="weekday">周${w}</div>`).join("");const lineOrder=LINE_OPTS;let day=1,next=1;for(let i=0;i<42;i++){let dn,cur=true,ds;if(i<sw){dn=prevDays-(sw-i)+1;cur=false;const pm=cm===0?11:cm-1,py=cm===0?cy-1:cy;ds=`${py}-${pad2(pm+1)}-${pad2(dn)}`;}else if(day<=days){dn=day++;ds=`${cy}-${pad2(cm+1)}-${pad2(dn)}`;}else{dn=next++;cur=false;const nm=cm===11?0:cm+1,ny=cm===11?cy+1:cy;ds=`${ny}-${pad2(nm+1)}-${pad2(dn)}`;}const block=[];lineOrder.forEach(ln=>{PRODUCT_CATS.forEach(cat=>{const v=(daily[ds]&&daily[ds][ln]&&daily[ds][ln][cat])||0;if(v<=0)return;const capVal=catCap[cat]||DEFAULT_CAT_CAP[cat]||0;const pct=capVal>0?((v/capVal)*100).toFixed(1):"—";const subLab=`${ln}·${cat}`;block.push(`<div class="sub-row"><span class="sub-l" title="${escapeAttr(subLab)}">${subLab}</span><span class="sub-c">${v}</span><span class="sub-r" title="对标该类日产能">${pct}${pct==="—"?"":"%"}</span></div>`);});});const linesHtml=block.join("");html+=`<div class="day" style="${cur?"":"opacity:.45"}"><div class="day-number">${dn}</div>${linesHtml?`<div class="sub">${linesHtml}</div>`:""}</div>`;}$("calendarGrid").innerHTML=html;}

  function renderRpGrid(){const first=new Date(rpYear,rpMonth,1),sw=first.getDay(),dim=new Date(rpYear,rpMonth+1,0).getDate(),prevDim=new Date(rpYear,rpMonth,0).getDate();let day=1,next=1,html="";const today=fmt(new Date());let ra="",rb="";if(rpStart){if(rpEnd){ra=lo(rpStart,rpEnd);rb=hi(rpStart,rpEnd);}else{ra=lo(rpStart,rpHover||rpStart);rb=hi(rpStart,rpHover||rpStart);}}for(let i=0;i<42;i++){let dn,cur,ds;if(i<sw){dn=prevDim-(sw-i)+1;cur=false;const pm=rpMonth===0?11:rpMonth-1,py=rpMonth===0?rpYear-1:rpYear;ds=ymd(py,pm+1,dn);}else if(day<=dim){dn=day++;cur=true;ds=ymd(rpYear,rpMonth+1,dn);}else{dn=next++;cur=false;const nm=rpMonth===11?0:rpMonth+1,ny=rpMonth===11?rpYear+1:rpYear;ds=ymd(ny,nm+1,dn);}let cls="rp-cell"+(cur?"":" other")+(ds===today?" today":"");if(skipSundayBlocked()&&isSundayDs(ds))cls+=" rp-sun-ban";if(rpStart&&ds>=ra&&ds<=rb)cls+=" in-range";if(rpStart&&ds===rpStart)cls+=" anchor";if(rpStart){const pe=(!rpEnd&&rpHover&&rpHover!==rpStart&&ds===rpHover)||(rpEnd&&rpEnd!==rpStart&&ds===rpEnd);if(pe)cls+=" preview-end";}html+=`<div class="${cls}" data-ds="${ds}">${dn}</div>`;}$("rpGrid").innerHTML=html;$("rpGrid").querySelectorAll(".rp-cell").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();rpCellClick(el.dataset.ds);});el.addEventListener("mouseenter",e=>{e.stopPropagation();if(rpStart&&!rpEnd&&el.dataset.ds!==rpHover){rpHover=el.dataset.ds;renderRpGrid();}});});}
