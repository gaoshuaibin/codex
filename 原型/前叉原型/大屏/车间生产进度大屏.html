<!DOCTYPE html>
<html lang="zh-CN">

        * {

            padding: 0;
            box-sizing: border-box;
        }

            font-family: 'Inter', 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        /* 主容器 - 蓝底工业风 */
        .industrial-dashboard {
            max-width: 1920px;
            margin: 0 auto;
            background: #0c2140;
            background: linear-gradient(145deg, #0b1e3a 0%, #0a1a30 100%);
            border: 1px solid #2c5a7a;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
            padding: 24px 28px 32px;
            position: relative;
        }
        /* 极简工业角标 */
        .industrial-dashboard::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 12px;
            width: 32px;
            height: 32px;
            border-top: 2px solid #3a7ca5;
            border-left: 2px solid #3a7ca5;
            pointer-events: none;
        }
        .industrial-dashboard::after {
            content: "";
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-bottom: 2px solid #3a7ca5;
            border-right: 2px solid #3a7ca5;
            pointer-events: none;
        }

        /* 头部区域 */
        .header-industrial {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 2px solid #2c5a78;
            padding-bottom: 18px;
        }
        .title-area h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #eef4ff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #9fc7e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 4px rgba(50,120,200,0.3);
        }
        .date-gauge {
            background: #0e2642;
            padding: 6px 22px;
            border-left: 4px solid #3f8ab3;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 1.1rem;
            color: #cde4ff;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
        }

        /* 三车间卡片 — 增强工单状态明细 */
        .shop-grid-industrial {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 48px;
        }
        .shop-card-industrial {
            background: #0f2942;
            border: 1px solid #2d6582;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            padding: 22px 20px;
            transition: all 0.2s ease;
            position: relative;
        }
        .shop-card-industrial:hover {
            border-color: #4c9ac9;
            transform: translateY(-2px);
            background: #123153;
            box-shadow: 0 10px 18px rgba(0,0,0,0.5);
        }
        .shop-header-industrial {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
            border-bottom: 2px solid #2b6685;
            padding-bottom: 10px;
        }
        .shop-name-industrial {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Inter', monospace;
            color: #e2f0ff;
            letter-spacing: 1px;
        }
        /* 核心KPI三指标 (计划/完成/不良) */

            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .kpi-tile {
            flex: 1;
            background: #071a2c;
            padding: 12px 6px;
            text-align: center;
            border-bottom: 2px solid #2a6c8c;
        }
        .kpi-label-industrial {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #9bbfd9;
            letter-spacing: 1px;
        }
        .kpi-value-industrial {
            font-size: 1.9rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            color: #f0f7ff;

        }
        .defect-industrial {
            color: #ff9f7a;
        }

        .order-stats-grid {

            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 16px 0 14px;
            background: #071a2c;
            padding: 12px 10px;
            border-radius: 4px;

        .order-stat-item {

            font-size: 0.8rem;
            font-weight: 500;
            border-bottom: 1px dashed #2c6280;

        .order-stat-label {

        }
        .order-stat-number {

            font-weight: 800;
            font-size: 1rem;
            color: #ffd89a;
        }
        .delayed-number {

        }
        .progress-industrial {

        }
        .progress-label-industrial {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: #b8d6f0;
            margin-bottom: 6px;
        }
        .progress-bg-industrial {
            background: #0b2a3b;
            height: 10px;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px #00000044;
        }
        .progress-fill-industrial {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3f8ab3, #6eb3d9);

            color: #d9ecff;
            font-weight: 700;

        }

    </style>
</head>

        ];

        // 获取最新日期作为大屏“当日”
        const allDates = [...new Set(productionData.map(d => d.date))].sort();
        const TODAY = allDates[allDates.length - 1]; // 2026-03-17

        function getTodayData() {
            return productionData.filter(item => item.date === TODAY);
        }

        // 判断工单是否延期：未完成 且 计划完成日期 < 当日（基准日）
        function isDelayed(item, todayStr) {
            if (item.actual >= item.plan && item.plan > 0) return false; // 已完成不算延期
            // 计划完成日期小于今日（且工单未完成状态）
            return item.planFinishDate < todayStr;
        }

        // 获取每个车间的工单状态细分（未开始/进行中/已完成/延期）
        function getShopOrderBreakdown(todayItems, todayStr) {
            const shops = ['备料', '焊接', '组装'];
            const breakdown = {};
            shops.forEach(shop => {
                breakdown[shop] = {
                    notStarted: 0,    // 未开始（actual = 0 且 未完成）
                    inProgress: 0,    // 进行中（actual > 0 且 actual < plan）
                    completed: 0,     // 已完成（actual >= plan）
                    delayed: 0        // 延期（未完成且计划完成日期 < 今日）
                };
            });

            todayItems.forEach(item => {
                const shop = item.shop;
                if (!breakdown[shop]) return;
                const isCompleted = (item.actual >= item.plan && item.plan > 0);
                const isInProgress = (!isCompleted && item.actual > 0 && item.actual < item.plan);
                const isNotStarted = (item.actual === 0 && !isCompleted);
                
                if (isCompleted) {
                    breakdown[shop].completed += 1;
                } else if (isInProgress) {
                    breakdown[shop].inProgress += 1;
                } else if (isNotStarted) {
                    breakdown[shop].notStarted += 1;
                }
                
                // 延期统计：未完成工单（未开始或进行中）且计划完成日期小于今日
                if (!isCompleted && isDelayed(item, todayStr)) {
                    breakdown[shop].delayed += 1;
                }
            });
            return breakdown;
        }

        function computeShopSummary(todayItems) {
            const shops = ['备料', '焊接', '组装'];
            const map = {};
            shops.forEach(s => { map[s] = { plan: 0, actual: 0, defect: 0, orderCount: 0 }; });
            todayItems.forEach(item => {
                if (map[item.shop]) {
                    map[item.shop].plan += item.plan;
                    map[item.shop].actual += item.actual;
                    map[item.shop].defect += item.defect;
                    map[item.shop].orderCount += 1;
                }
            });
            return map;
        }

        function renderShopCards(todayData) {
            const summary = computeShopSummary(todayData);
            const breakdown = getShopOrderBreakdown(todayData, TODAY);
            const shopList = ['备料', '焊接', '组装'];
            const container = document.getElementById('industrialShopGrid');
            container.innerHTML = '';
            
            for (let shop of shopList) {
                const stat = summary[shop];
                const plan = stat.plan;
                const actual = stat.actual;
                const defect = stat.defect;
                const completion = plan > 0 ? (actual / plan * 100).toFixed(1) : '0.0';
                const defectRate = actual > 0 ? (defect / actual * 100).toFixed(1) : '0.0';
                const orderStats = breakdown[shop];
                
                const card = document.createElement('div');
                card.className = 'shop-card-industrial';
                card.innerHTML = `
                    <div class="shop-header-industrial">
                        <span class="shop-name-industrial">${shop}车间</span>
                    </div>
                    <div class="kpi-grid-industrial">
                        <div class="kpi-tile"><div class="kpi-label-industrial">计划数</div><div class="kpi-value-industrial">${plan.toLocaleString()}</div></div>
                        <div class="kpi-tile"><div class="kpi-label-industrial">完成数</div><div class="kpi-value-industrial">${actual.toLocaleString()}</div></div>
                        <div class="kpi-tile"><div class="kpi-label-industrial">不良数</div><div class="kpi-value-industrial defect-industrial">${defect}</div></div>
                    </div>
                    <div class="order-stats-grid">
                        <div class="order-stat-item"><span class="order-stat-label">未开始工单</span><span class="order-stat-number">${orderStats.notStarted}</span></div>
                        <div class="order-stat-item"><span class="order-stat-label">进行中工单</span><span class="order-stat-number">${orderStats.inProgress}</span></div>
                        <div class="order-stat-item"><span class="order-stat-label">已完成工单</span><span class="order-stat-number">${orderStats.completed}</span></div>
                        <div class="order-stat-item"><span class="order-stat-label">延期工单</span><span class="order-stat-number delayed-number">${orderStats.delayed}</span></div>
                    </div>
                    <div class="progress-industrial">
                        <div class="progress-label-industrial"><span>完成率</span><span>${completion}%</span></div>
                        <div class="progress-bg-industrial"><div class="progress-fill-industrial" style="width: ${completion}%;"></div></div>
                        <div class="defect-stats">不良率 ${defectRate}%  |  总工单 ${stat.orderCount}</div>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function renderWorkTable(todayData) {
            const tbody = document.getElementById('industrialWorkbody');
            const totalSpan = document.getElementById('totalOrdersInd');
            const finishedSpan = document.getElementById('finishedOrdersInd');
            const defectsSpan = document.getElementById('totalDefectsInd');
            let totalDefect = 0, finishedCount = 0;
            todayData.forEach(item => {
                totalDefect += item.defect;
                if (item.actual >= item.plan && item.plan > 0) finishedCount++;
            });
            totalSpan.innerText = todayData.length;
            finishedSpan.innerText = finishedCount;
            defectsSpan.innerText = totalDefect;
            
            if (todayData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" style="text-align:center; padding:36px;">今日无工单记录</td></tr>';
                return;
            }
            let rows = '';
            for (let item of todayData) {
                let statusText = '', statusClass = '';
                if (item.actual >= item.plan && item.plan > 0) { statusText = '已完成'; statusClass = 'status-done-industrial'; }
                else if (item.actual > 0 && item.actual < item.plan) { statusText = '进行中'; statusClass = 'status-progress-industrial'; }
                else { statusText = '未开始'; statusClass = 'status-pending-industrial'; }
                const rate = item.plan > 0 ? (item.actual / item.plan * 100).toFixed(1) : '0.0';
                const actualStart = item.actualStartDate || '—';
                const actualFinish = item.actualFinishDate || '—';
                rows += `<tr>
                    <td><span class="order-number-industrial">${item.orderNo}</span> <span class="product-name-industrial">${item.product}</span></td>
                    <td>${item.plan.toLocaleString()}</td>
                    <td>${item.wo}</td>
                    <td>${item.shop}</td>
                    <td>${item.planStartDate}</td>
                    <td>${item.planFinishDate}</td>
                    <td>${actualStart}</td>
                    <td>${actualFinish}</td>
                    <td>${item.actual.toLocaleString()}</td>
                    <td class="defect-cell-industrial">${item.defect}</td>
                    <td>${rate}%</td>
                    <td><span class="status-badge-industrial ${statusClass}">${statusText}</span></td>
                </tr>`;
            }
            tbody.innerHTML = rows;
        }

        function setHeaderDate() {
            const elem = document.getElementById('industrialDateDisplay');
            const d = new Date(TODAY + 'T12:00:00');
            const weekDay = d.toLocaleDateString('zh-CN', { weekday: 'short' });
            elem.innerText = `生产基准日：${TODAY} (${weekDay})`;
        }

        function init() {
            const todayItems = getTodayData();
            renderShopCards(todayItems);
            renderWorkTable(todayItems);
            setHeaderDate();
        }
        init();
    })();
</script>
</body>
</html>
