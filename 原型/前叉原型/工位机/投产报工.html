<!DOCTYPE html>

<body>
<div class="kanban">
    <div class="page-toolbar">
        <div class="line-select-wrap">
            <label for="productionLineSelect">产线</label>

                <option value="组装A线">组装A线</option>

        </div>

    </div>

            <span class="card-icon">⚙️</span>

                <div class="card-sub-stats"><div class="sub-stat-item"><span class="sub-stat-label">📦 未完成数量</span><span class="sub-stat-value" id="unfinishedRemainQty">0</span></div></div>
            </div>
        </div>
        <div class="stat-card" data-filter="today" id="cardToday">
            <span class="card-icon">📆</span>
            <div class="card-content">
                <span class="card-title">当日订单</span>
                <span class="card-number" id="todayCount">0</span>
                <div class="card-sub-stats">
                    <div class="sub-stat-item"><span class="sub-stat-label">🏭 当日生产总数</span><span class="sub-stat-value" id="todayTotalQty">0</span></div>
                    <div class="sub-stat-item"><span class="sub-stat-label">🧾 未完成单数</span><span class="sub-stat-value" id="todayRemainOrders">0</span></div>
                    <div class="sub-stat-item"><span class="sub-stat-label">⏳ 未完成数量</span><span class="sub-stat-value" id="todayRemainQty">0</span></div>
                </div>
            </div>
        </div>
        <div class="stat-card" data-filter="planned" id="cardPlanned">
            <span class="card-icon">📌</span>
            <div class="card-content">
                <span class="card-title">计划订单</span>
                <span class="card-number" id="plannedCount">0</span>
                <div class="card-sub-stats"><div class="sub-stat-item"><span class="sub-stat-label">📋 计划生产数量</span><span class="sub-stat-value" id="plannedTotalQty">0</span></div></div>
            </div>
        </div>
    </div>

    <div class="table-wrapper" id="tableWrapper"></div>
    <div class="pagination"><button id="prevPageBtn">上一页</button><div class="page-numbers" id="pageNumbers"></div><button id="nextPageBtn">下一页</button><span>共 <span id="totalRecords">0</span> 条记录</span></div>
</div>

<script>
    (function() {
        const todayStr = '2026-03-27';
        const operators = ['张明', '李芳', '王海', '赵敏', '陈刚', '刘敏'];
        
        function getMaterialListForOrder(prodOrder, orderStatus = '') {
            const baseMaterials = [
                { name: '电机组件', required: 150, available: 150, unit: '个', status: 'full' },
                { name: '控制面板', required: 150, available: 150, unit: '个', status: 'full' },
                { name: '杯体组件', required: 150, available: 105, unit: '个', status: 'partial' },
                { name: '底座组件', required: 150, available: 105, unit: '个', status: 'partial' },
                { name: '电源线', required: 150, available: 135, unit: '个', status: 'partial' },
                { name: '锁体', required: 150, available: 150, unit: '个', status: 'full' },
                { name: '指纹模块', required: 150, available: 120, unit: '个', status: 'partial' },
                { name: '蓝牙模块', required: 150, available: 150, unit: '个', status: 'full' }
            ];
            let hash = 0;
            for (let i = 0; i < prodOrder.length; i++) hash = ((hash << 5) - hash) + prodOrder.charCodeAt(i);
            let dynamicMaterials = baseMaterials.map(m => ({
                ...m,
                required: Math.floor(m.required * (0.95 + (Math.abs(hash) % 15)/100)),
                available: Math.floor(m.available * (0.9 + (Math.abs(hash) % 25)/100))
            }));
            if (orderStatus === 'done') {
                dynamicMaterials = dynamicMaterials.map(m => ({ ...m, available: m.required, status: 'full' }));
            }
            return dynamicMaterials;
        }
        
        function calculateKitRate(materials) {
            let totalRequired = 0, totalAvailable = 0;
            materials.forEach(m => { totalRequired += m.required; totalAvailable += Math.min(m.available, m.required); });
            return totalRequired > 0 ? Math.round((totalAvailable / totalRequired) * 100) : 0;
        }
        
        function enhanceOrders(orders) {
            return orders.map(order => {
                let plannedStartDate = order.startTime ? order.startTime.split(' ')[0] : '2026-03-20';
                let actualStartTime = '';
                if (order.status === 'ongoing' || order.status === 'done' || order.status === 'paused') actualStartTime = order.startTime || '';
                let plannedEndDate = plannedStartDate;
                let daysToAdd = 5 + (order.priority === '紧急' ? 2 : (parseInt(order.priority) || 5) % 6);
                let date = new Date(plannedStartDate);
                date.setDate(date.getDate() + daysToAdd);
                plannedEndDate = date.toISOString().slice(0,10);
                let actualEndTime = '';
                if (order.status === 'done' && order.reportRecords && order.reportRecords.length > 0) {
                    actualEndTime = order.reportRecords[order.reportRecords.length - 1].time;
                }
                const productionOrderNo = order.prodOrder ? order.prodOrder.replace(/^FO-/, 'PO-') : '';
                return { ...order, plannedStartDate, actualStartTime, plannedEndDate, actualEndTime, productionOrderNo };
            });
        }
        
        let rawUnfinished = [
            { salesOrder: 'SO-240326-02', prodOrder: 'FO-20260326-002', model: 'FORK-AM-RL', name: '铝合金减震前叉', type: 'mtb', planned: 1200, completed: 540, startTime: '2026-03-26 09:15', status: 'ongoing', priority: '8', reportRecords: [] },
            { salesOrder: 'SO-240327-06', prodOrder: 'FO-20260327-006', model: 'FORK-AM-29', name: '29寸气压前叉', type: 'mtb', planned: 780, completed: 390, startTime: '2026-03-27 11:20', status: 'ongoing', priority: '7', reportRecords: [] },

                if (headerFilters.productionOrderNo && !(order.productionOrderNo || '').toLowerCase().includes(headerFilters.productionOrderNo.toLowerCase())) return false;
                if (headerFilters.model && !order.model.toLowerCase().includes(headerFilters.model.toLowerCase())) return false;
                if (headerFilters.status && order.status !== headerFilters.status) return false;
                if (headerFilters.priority && order.priority !== headerFilters.priority) return false;
                return true;

        // 报工模态框，增加【一键完成】按钮
        function showReportModal(order) {
            if (order.status !== 'ongoing') { showMessage('只有进行中的任务可以报工'); return; }
            const existingModal = document.querySelector('.modal-overlay');
            if (existingModal) existingModal.remove();
            const currentOrder = order;
            const refreshStats = () => {
                const remaining = currentOrder.planned - currentOrder.completed;
                const completedSpan = document.getElementById('reportCompletedValue');
                const remainingSpan = document.getElementById('reportRemainingValue');
                if (completedSpan) completedSpan.innerText = currentOrder.completed.toLocaleString() + ' 件';
                if (remainingSpan) remainingSpan.innerText = remaining.toLocaleString() + ' 件';
                const qtyInput = document.getElementById('reportQty');
                if (qtyInput && remaining > 0) { qtyInput.max = remaining; if (parseInt(qtyInput.value) > remaining) qtyInput.value = Math.min(remaining, 50); }
            };
            const remaining = currentOrder.planned - currentOrder.completed;
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-container" style="width:480px;"><div class="modal-header"><span>📦 报工 · ${escapeHtml(currentOrder.prodOrder)}</span><button class="modal-close">&times;</button></div><div class="modal-body"><div class="report-info-row"><div class="report-info-label">计划数量</div><div class="report-info-value">${currentOrder.planned.toLocaleString()} 件</div></div><div class="report-info-row"><div class="report-info-label">当前已完成</div><div class="report-info-value" id="reportCompletedValue">${currentOrder.completed.toLocaleString()} 件</div></div><div class="report-info-row"><div class="report-info-label">剩余待完成</div><div class="report-info-value" id="reportRemainingValue">${remaining.toLocaleString()} 件</div></div><div class="report-group"><label>📝 本次报工数量</label><input type="number" id="reportQty" min="1" max="${remaining}" value="${Math.min(remaining, 50)}" step="1"></div><div class="report-group"><label>👤 操作员</label><input type="text" id="operatorName" placeholder="请输入操作员姓名" value="${operators[0]}"></div><div id="reportError" class="error-msg"></div><div id="reportSuccessMsg" class="success-msg"></div></div><div class="modal-buttons flex-buttons"><button class="cancel-btn">关闭</button><button class="primary confirm-report">确认报工</button><button class="warning complete-order-btn">✅ 完成工单</button></div></div>`;
            document.body.appendChild(modal);
            const closeModalHandler = () => modal.remove();
            modal.querySelector('.modal-close').onclick = closeModalHandler;
            modal.querySelector('.cancel-btn').onclick = closeModalHandler;
            const qtyInput = modal.querySelector('#reportQty');
            const operatorInput = modal.querySelector('#operatorName');
            const errorSpan = modal.querySelector('#reportError');
            const successSpan = modal.querySelector('#reportSuccessMsg');
            
            const confirmReport = () => {
                let qty = parseInt(qtyInput.value, 10);
                let operator = operatorInput.value.trim();
                errorSpan.innerText = ''; successSpan.innerText = '';
                const currentRemaining = currentOrder.planned - currentOrder.completed;
                if (isNaN(qty) || qty <= 0) { errorSpan.innerText = '请输入有效数量'; return; }
                if (qty > currentRemaining) { errorSpan.innerText = `不能超过剩余数量 ${currentRemaining}`; return; }
                if (!operator) { errorSpan.innerText = '请输入操作员姓名'; return; }
                addReportRecord(currentOrder, qty, operator);
                currentOrder.completed += qty;
                updateCardCounts();
                renderTable();
                if (currentOrder.completed >= currentOrder.planned) {
                    currentOrder.status = 'done';
                    currentOrder.actualEndTime = new Date().toLocaleString('zh-CN', {hour12: false});
                    showMessage(`✅ 报工完成！订单 ${currentOrder.prodOrder} 已完成`);
                    closeModalHandler();
                    updateCardCounts();
                    renderTable();
                } else {
                    refreshStats();
                    successSpan.innerText = `✓ 报工成功！本次报工 ${qty} 件，当前完成 ${currentOrder.completed}/${currentOrder.planned}`;
                    const newRemaining = currentOrder.planned - currentOrder.completed;
                    qtyInput.value = Math.min(newRemaining, 50);
                    if (qtyInput.value < 1) qtyInput.value = 1;
                    qtyInput.max = newRemaining;
                }
            };
            modal.querySelector('.confirm-report').onclick = confirmReport;
            // 一键完成工单
            const completeOrder = () => {
                const remainingQty = currentOrder.planned - currentOrder.completed;
                if (remainingQty <= 0) {
                    showMessage(`工单 ${currentOrder.prodOrder} 已经完成，无需再次操作`);
                    closeModalHandler();
                    return;
                }
                const operator = operatorInput.value.trim() || '系统';
                addReportRecord(currentOrder, remainingQty, operator);
                currentOrder.completed = currentOrder.planned;
                currentOrder.status = 'done';
                currentOrder.actualEndTime = new Date().toLocaleString('zh-CN', {hour12: false});
                updateCardCounts();
                renderTable();
                showMessage(`🎉 工单 ${currentOrder.prodOrder} 已强制完成！补齐报工 ${remainingQty} 件`);
                closeModalHandler();
            };
            modal.querySelector('.complete-order-btn').onclick = completeOrder;
            modal.addEventListener('click', (e) => { if(e.target === modal) closeModalHandler(); });
        }
        
        function bindTableActions() {
            const wrapper = document.getElementById('tableWrapper');
            if(!wrapper) return;
            if (wrapper._listener) wrapper.removeEventListener('click', wrapper._listener);
            const clickHandler = (e) => {
                const btn = e.target.closest('.action-btn');
                if(btn) {
                    const row = btn.closest('tr');
                    if(!row) return;
                    // 获取生产订单号 - 第2列（索引1）
                    const cells = row.querySelectorAll('td');
                    if(cells.length < 2) return;
                    const prodOrder = cells[1]?.innerText || '';
                    if(!prodOrder) return;
                    const order = allOrders.find(o => o.prodOrder === prodOrder);
                    if(!order) return;
                    const btnText = btn.innerText;
                    if(btnText.includes('投产')) { 
                        if(order.status === 'pending') { 
                            order.status = 'ongoing'; 
                            order.actualStartTime = new Date().toLocaleString('zh-CN', {hour12: false}); 
                            order.startTime = order.actualStartTime; 
                            showMessage(`🚀 已投产: ${order.prodOrder}`); 
                            renderTable(); 
                            updateCardCounts(); 
                        } else { 
                            showMessage('仅待投产订单可投产'); 
                        } 
                    }
                    else if(btnText.includes('暂停') && order.status === 'ongoing') { 
                        order.status = 'paused'; 
                        showMessage(`⏸️ 已暂停: ${order.prodOrder}`); 
                        renderTable(); 
                        updateCardCounts(); 
                    }
                    else if(btnText.includes('复工') && order.status === 'paused') { 
                        order.status = 'ongoing'; 
                        showMessage(`▶️ 已复工: ${order.prodOrder}`); 
                        renderTable(); 
                        updateCardCounts(); 
                    }
                    else if(btnText.includes('报工') && !btn.classList.contains('disabled')) { 
                        showReportModal(order); 
                    }
                    else if(btnText.includes('详情')) { 
                        showDetailModal(order); 
                    }
                    return;
                }
                const filterBtn = e.target.closest('.filter-trigger-btn');
                if(filterBtn && filterBtn.dataset.column) { e.stopPropagation(); showPanel(filterBtn.dataset.column, filterBtn); }
            };
            wrapper.addEventListener('click', clickHandler);
            wrapper._listener = clickHandler;
        }
        
        let currentPage = 1;
        function renderTable() {
            const orders = getFilteredOrdersByCardAndUI();
            const totalRecords = orders.length;
            document.getElementById('totalRecords').innerText = totalRecords;
            const rowsPerPage = 10;
            const totalPages = Math.ceil(totalRecords / rowsPerPage);
            if(currentPage > totalPages) currentPage = totalPages || 1;
            const startIdx = (currentPage - 1) * rowsPerPage;
            const pageOrders = orders.slice(startIdx, startIdx + rowsPerPage);
            const pageNumbersDiv = document.getElementById('pageNumbers');
            pageNumbersDiv.innerHTML = '';
            for(let i = 1; i <= totalPages; i++) {
                const pageSpan = document.createElement('span');
                pageSpan.className = `page-num ${i === currentPage ? 'active' : ''}`;
                pageSpan.innerText = i;
                pageSpan.onclick = (function(page) { return function() { currentPage = page; renderTable(); }; })(i);
                pageNumbersDiv.appendChild(pageSpan);
            }
            document.getElementById('prevPageBtn').onclick = () => { if(currentPage > 1) { currentPage--; renderTable(); } };
            document.getElementById('nextPageBtn').onclick = () => { if(currentPage < totalPages) { currentPage++; renderTable(); } };
            const hasProdFilter = !!headerFilters.prodOrder, hasProductionOrderFilter = !!headerFilters.productionOrderNo, hasModelFilter = !!headerFilters.model, hasStatusFilter = !!headerFilters.status, hasPriorityFilter = !!headerFilters.priority;
            let tableHtml = '<table><thead><tr>';
            tableHtml += '<th>销售订单号</th><th><div class="header-title">生产工单号<span class="filter-trigger-btn '+(hasProdFilter?'active-filter':'')+'" data-column="prodOrder">🔽 筛选</span></div></th>';
            tableHtml += '<th><div class="header-title">生产订单号<span class="filter-trigger-btn '+(hasProductionOrderFilter?'active-filter':'')+'" data-column="productionOrderNo">🔽 筛选</span></div></th>';
            tableHtml += '<th class="nowrap-cell"><div class="header-title">图号<span class="filter-trigger-btn '+(hasModelFilter?'active-filter':'')+'" data-column="model">🔽 筛选</span></div></th>';
            tableHtml += '<th>计划数量</th><th>已完成</th><th>预计开工日期</th><th>实际开工时间</th><th>预计完工日期</th><th>实际完工时间</th>';
            tableHtml += '<th><div class="header-title">状态<span class="filter-trigger-btn '+(hasStatusFilter?'active-filter':'')+'" data-column="status">🔽 筛选</span></div></th>';
            tableHtml += '<th><div class="header-title">优先级<span class="filter-trigger-btn '+(hasPriorityFilter?'active-filter':'')+'" data-column="priority">🔽 筛选</span></div></th>';
            tableHtml += '<th class="nowrap-cell">操作</th></tr></thead><tbody>';
            if (pageOrders.length === 0) tableHtml += '<tr><td colspan="12" style="text-align:center; padding:40px;">暂无匹配订单</td></tr>';
            else for (const o of pageOrders) {
                let statusClass = '', statusText = '';
                if(o.status === 'ongoing') { statusClass='ongoing'; statusText='进行中'; }
                else if(o.status === 'pending') { statusClass='pending'; statusText='待投产'; }
                else if(o.status === 'paused') { statusClass='paused'; statusText='已暂停'; }
                else if(o.status === 'done') { statusClass='done'; statusText='已完成'; }
                const priorityClass = getPriorityClass(o.priority);
                const iconClass = getProductIconClass(o.type);
                let actionButtons = '';
                if(o.status === 'done') actionButtons = '<span class="action-btn">详情</span><span class="action-btn secondary completed">已完成</span><span class="action-btn report disabled">报工</span>';
                else if(o.status === 'pending') actionButtons = '<span class="action-btn">详情</span><span class="action-btn primary">投产</span><span class="action-btn report disabled">报工</span>';
                else if(o.status === 'paused') actionButtons = '<span class="action-btn">详情</span><span class="action-btn secondary">复工</span><span class="action-btn report">报工</span>';
                else actionButtons = '<span class="action-btn">详情</span><span class="action-btn secondary">暂停</span><span class="action-btn report">报工</span>';
                tableHtml += `<tr>
                    <td class="nowrap-cell">${escapeHtml(o.salesOrder)}</td>
                    <td class="nowrap-cell">${escapeHtml(o.prodOrder)}</td>
                    <td class="nowrap-cell">${escapeHtml(o.productionOrderNo)}</td>
                    <td class="nowrap-cell"><span class="${iconClass}"></span> ${escapeHtml(o.model)}</td>
                    <td class="numeric">${o.planned.toLocaleString()}</td>
                    <td class="numeric">${o.completed.toLocaleString()}</td>
                    <td>${escapeHtml(o.plannedStartDate)}</td>
                    <td class="nowrap-cell">${o.actualStartTime || '未开工'}</td>
                    <td>${escapeHtml(o.plannedEndDate)}</td>
                    <td class="nowrap-cell">${o.actualEndTime || '未完工'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td><span class="priority-tag ${priorityClass}">${escapeHtml(o.priority)}</span></td>
                    <td class="action-btns nowrap-cell">${actionButtons}</td>
                </tr>`;
            }
            tableHtml += '</tbody></table>';
            document.getElementById('tableWrapper').innerHTML = tableHtml;
            bindTableActions();
            closeAllPanels();
        }
        
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]; }); }
        function initCards() { document.querySelectorAll('.stat-card').forEach(card => { card.addEventListener('click', function() { document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('active')); this.classList.add('active'); currentCardFilter = this.dataset.filter; currentPage=1; renderTable(); }); }); }
        function initPageToolbar() {
            const workerShiftBtn = document.getElementById('workerShiftBtn');
            if (workerShiftBtn) {
                workerShiftBtn.addEventListener('click', () => {
                    window.location.href = '生产上下工.html?from=' + encodeURIComponent('投产报工.html');
                });
            }
        }
        
        updateCardCounts();
        renderTable();
        initCards();
        initPageToolbar();
    })();
</script>
</body>
</html>
